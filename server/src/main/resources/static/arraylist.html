<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ArrayList&lt;Int&gt; playground</title>
  <style>
    /* Палитра как в arraylist-ide.html (IntelliJ Darcula) */
    :root {
      --bg: #1e1f22; --panel: #2b2d30; --border: #3c3f41; --text: #bcbec4; --dim: #6f737a;
      --keyword: #cf8e6d; --fn: #56a8f5; --num: #2aacb8; --str: #6aab73;
      --in: #56a8f5; --out: #6aab73; --fail: #f75464;
    }
    body {
      font: 13px/1.5 "JetBrains Mono", ui-monospace, Menlo, monospace; margin: 16px;
      background: var(--bg); color: var(--text);
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    h2 { color: var(--keyword); font-weight: normal; }
    .controls { margin: 12px 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .controls .command { margin-left: 24px; } /* команды списка — с отступом под list# */
    .controls input {
      width: 60px; background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
      color: var(--num); font: inherit; padding: 0 4px;
    }
    .controls button {
      background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
      color: var(--fn); font: inherit; padding: 0 8px; cursor: pointer;
    }
    .controls button:hover { border-color: var(--fn); }
    .on { color: var(--out); }
    .off { color: var(--fail); }
    h3 { margin: 16px 0 4px; border-bottom: 1px solid var(--border); color: var(--dim); font-weight: normal; }
    .log { max-height: 40vh; overflow-y: auto; }
    .log div { white-space: pre-wrap; padding: 2px 0; border-bottom: 1px solid var(--panel); }
    .error { color: var(--fail); }
    .type { font-weight: bold; color: var(--fn); }
    .state-row { display: flex; gap: 8px; align-items: center; padding: 3px 0; color: var(--num); }
    .state-row .id { width: 32px; color: var(--keyword); }
    .method { padding: 0 6px; border: 1px solid var(--border); border-radius: 3px; color: var(--dim); }
    .method.active { background: var(--out); border-color: var(--out); color: var(--bg); }
    /* Послесвечение: после OUT бейдж не гаснет мгновенно, а затухает, как лампа накаливания */
    @keyframes afterglow {
      from { background: var(--out); border-color: var(--out); color: var(--bg); }
      to { background: transparent; border-color: var(--border); color: var(--dim); }
    }
    @keyframes afterglow-failed {
      from { background: var(--fail); border-color: var(--fail); color: var(--bg); }
      to { background: transparent; border-color: var(--border); color: var(--dim); }
    }
    .empty { color: var(--dim); }

    /* Список в виде ячеек с индексами, как в arraylist-ide.html */
    .list-card { padding: 4px 0 8px; border-bottom: 1px solid var(--panel); }
    .cells { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0 0 40px; min-height: 50px; }
    .cell { display: flex; flex-direction: column; align-items: center; }
    .cell .box {
      min-width: 40px; height: 32px; padding: 0 6px; display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--border); border-radius: 3px; color: var(--num); background: var(--panel);
    }
    .cell .idx { font-size: 11px; color: var(--dim); }
    .cell .arrow { color: var(--dim); margin-left: 2px; }
    .cell.ghost .box { border-style: dashed; border-color: var(--fail); color: var(--fail); background: none; }
    /* Подсветка ячеек тоже затухает, а не снимается рывком */
    @keyframes cell-new {
      from { background: color-mix(in srgb, var(--out) 45%, var(--panel)); border-color: var(--out); }
      to { background: var(--panel); border-color: var(--border); }
    }
    @keyframes cell-read {
      from { background: color-mix(in srgb, var(--in) 45%, var(--panel)); border-color: var(--in); }
      to { background: var(--panel); border-color: var(--border); }
    }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body>

<header>
  <h2>ArrayList&lt;Int&gt; playground</h2>
  <span id="status" class="off">● ws disconnected</span>
</header>

<div class="controls">
  <div><button id="create">create</button> <span class="empty">— создаст список и подставит его id ниже</span></div>
  <!-- Над каким списком выполняются команды ниже -->
  <div><label>list# <input id="arrayListId" type="number" value="1"></label></div>
  <div class="command"><button id="add">add</button>(value <input id="value" type="number" value="10">)</div>
  <div class="command"><button id="addAt">addAt</button>(index <input id="addAtIndex" type="number" value="0">, element <input id="addAtElement" type="number" value="7">)</div>
  <div class="command"><button id="get">get</button>(index <input id="index" type="number" value="0">)</div>
  <div class="command"><button id="remove">remove</button>()</div>
  <div><button id="clear">clear logs</button></div>
</div>

<h3>State</h3>
<div id="state"></div>

<h3>HTTP</h3>
<div id="http" class="log"></div>

<h3>WebSocket</h3>
<div id="ws" class="log"></div>

<script>
  const $ = id => document.getElementById(id);
  const base = '/api/arraylistint';

  // Новые записи сверху
  function prepend(logId, text, isError) {
    const row = document.createElement('div');
    row.textContent = text;
    if (isError) row.className = 'error';
    $(logId).prepend(row);
  }

  // ---------- REST ----------

  async function call(method, url, body) {
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) options.body = JSON.stringify(body);
    const request = `${method} ${url}${body !== undefined ? ' ' + JSON.stringify(body) : ''}`;
    try {
      const res = await fetch(url, options);
      const text = await res.text(); // у 204 тела нет
      prepend('http', `${request} → ${res.status} ${text}`, !res.ok);
      return res.ok && text ? JSON.parse(text) : null;
    } catch (e) {
      prepend('http', `${request} → ${e}`, true);
      return null;
    }
  }

  const listId = () => $('arrayListId').value;
  const num = id => Number($(id).value);

  $('create').onclick = async () => {
    const response = await call('POST', base);
    if (response) $('arrayListId').value = response.arrayListId;
  };
  $('add').onclick = () => call('POST', `${base}/${listId()}/add`, { value: num('value') });
  $('addAt').onclick = () => call('POST', `${base}/${listId()}/addAt`, { index: num('addAtIndex'), element: num('addAtElement') });
  $('get').onclick = () => call('POST', `${base}/${listId()}/get`, { index: num('index') });
  $('remove').onclick = () => call('DELETE', `${base}/${listId()}`);
  $('clear').onclick = () => { $('http').innerHTML = ''; $('ws').innerHTML = ''; };

  // ---------- State ----------

  // Часть type → метод в строке состояния: ARRAY_LIST_INT_ADD_AT_IN → addAt
  const METHOD_BY_TYPE = { ADD: 'add', ADD_AT: 'addAt', GET: 'get' };
  const METHODS = Object.values(METHOD_BY_TYPE);
  const FADE_MS = 800; // сколько затухает бейдж после выхода последнего потока — подбирается на глаз
  const CELL_FADE_MS = 1500; // сколько затухает подсветка ячеек — дольше, чтобы успеть рассмотреть

  // arrayListId → { id, elements, inside: { method: Set<thread> }, fade: { method: { start, failed } } }
  // fade.start — когда вышел последний поток (null — не затухает); fade.failed — гаснуть красным
  const lists = new Map();

  // Список создаётся и по CREATED, и по любому другому событию: страницу могли открыть уже после CREATED
  function listOf(id) {
    if (!lists.has(id)) {
      const inside = Object.fromEntries(METHODS.map(m => [m, new Set()]));
      const fade = Object.fromEntries(METHODS.map(m => [m, { start: null, failed: false }]));
      lists.set(id, { id, elements: [], inside, fade, cellEffect: null });
    }
    return lists.get(id);
  }

  function apply(env) {
    if (env.type === 'ARRAY_LIST_INT_CREATED') { listOf(env.data.arrayListId); return; }
    if (env.type === 'ARRAY_LIST_INT_REMOVED') { lists.delete(env.data.arrayListId); return; }

    // ARRAY_LIST_INT_ADD_IN, ARRAY_LIST_INT_GET_OUT_FAILED, ...
    const match = env.type.match(/^ARRAY_LIST_INT_(ADD_AT|ADD|GET)_(IN|OUT|OUT_FAILED)$/);
    if (!match) return;
    const method = METHOD_BY_TYPE[match[1]];
    const phase = match[2];
    const list = listOf(env.data.arrayListId);
    list.elements = env.data.elements;

    // Внутри метода может быть несколько потоков сразу: горит, пока не вышел последний, потом затухает
    const inside = list.inside[method];
    const fade = list.fade[method];
    if (phase === 'IN') {
      if (inside.size === 0) list.fade[method] = { start: null, failed: false }; // зажгли заново
      inside.add(env.data.thread);
    } else {
      inside.delete(env.data.thread);
      fade.failed ||= phase === 'OUT_FAILED'; // ошибку запоминаем, даже если внутри ещё есть потоки
      if (inside.size === 0) fade.start = performance.now();
    }

    const cells = cellEffectOf(method, phase, env.data);
    if (cells) {
      list.cellEffect = { ...cells, start: performance.now() };
      setTimeout(render, CELL_FADE_MS); // убрать «призрачную» ячейку, когда она догорит
    }
  }

  // Какие ячейки подсветить после этого события (null — ничего)
  function cellEffectOf(method, phase, data) {
    if (phase === 'OUT_FAILED') {
      // Индекс за концом массива — «призрачная» ячейка
      return data.index !== undefined && data.index >= data.elements.length ? { ghost: data.index } : null;
    }
    if (phase !== 'OUT') return null;
    // При гонке «последняя ячейка» для add — допущение, а не наблюдение
    if (method === 'add') return { new: data.elements.length - 1 };
    if (method === 'addAt') return { new: data.index, shiftedFrom: data.index + 1 };
    if (method === 'get') return { read: data.index };
    return null;
  }

  // Ячейка массива: значение и индекс под ним
  function cell(value, index) {
    const el = document.createElement('div');
    el.className = 'cell';
    const box = document.createElement('div');
    box.className = 'box';
    box.textContent = value;
    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = index;
    el.append(box, idx);
    return el;
  }

  // Анимация, продолженная с того места, где она была до пересоздания элемента
  const glow = (name, elapsed) => `${name} ${CELL_FADE_MS}ms ease-out ${-elapsed}ms forwards`;

  function renderCells(list) {
    const cells = document.createElement('div');
    cells.className = 'cells';
    const effect = list.cellEffect;
    const elapsed = effect ? performance.now() - effect.start : Infinity;
    const active = elapsed < CELL_FADE_MS;

    list.elements.forEach((value, i) => {
      const el = cell(value, i);
      if (active) {
        const box = el.querySelector('.box');
        if (effect.new === i) box.style.animation = glow('cell-new', elapsed);
        if (effect.read === i) box.style.animation = glow('cell-read', elapsed);
        if (effect.shiftedFrom !== undefined && i >= effect.shiftedFrom) {
          const arrow = Object.assign(document.createElement('span'), { className: 'arrow', textContent: '→' });
          arrow.style.animation = glow('fade-out', elapsed);
          box.append(arrow);
        }
      }
      cells.append(el);
    });

    if (active && effect.ghost !== undefined) {
      const ghost = cell('✗', effect.ghost);
      ghost.classList.add('ghost');
      ghost.style.animation = glow('fade-out', elapsed);
      cells.append(ghost);
    }
    return cells;
  }

  function render() {
    const root = $('state');
    root.innerHTML = '';
    if (lists.size === 0) {
      root.innerHTML = '<div class="empty">нет списков</div>';
      return;
    }
    for (const list of [...lists.values()].sort((a, b) => a.id - b.id)) {
      const card = document.createElement('div');
      card.className = 'list-card';
      const row = document.createElement('div');
      row.className = 'state-row';

      const id = document.createElement('span');
      id.className = 'id';
      id.textContent = `#${list.id}`;
      row.append(id);

      for (const method of METHODS) {
        const threads = list.inside[method];
        const el = document.createElement('span');
        el.className = 'method' + (threads.size > 0 ? ' active' : '');
        // Бейдж пересоздаётся на каждый render. Отрицательная задержка продолжает затухание
        // с того места, где оно было, — без неё анимация начиналась бы заново и бейдж дёргался
        const { start, failed } = list.fade[method];
        const elapsed = start === null ? Infinity : performance.now() - start;
        if (threads.size === 0 && elapsed < FADE_MS) {
          el.style.animation = `${failed ? 'afterglow-failed' : 'afterglow'} ${FADE_MS}ms ease-out ${-elapsed}ms forwards`;
        }
        el.textContent = method + (threads.size > 1 ? ` ×${threads.size}` : '');
        el.title = threads.size > 0 ? [...threads].join('\n') : '';
        row.append(el);
      }

      card.append(row, renderCells(list));
      root.append(card);
    }
  }

  // ---------- WebSocket ----------

  function showEnvelope(env) {
    const row = document.createElement('div');
    const type = document.createElement('span');
    type.className = 'type';
    type.textContent = env.type;
    const time = new Date(env.ts).toISOString().slice(11, 23); // HH:MM:SS.mmm, UTC
    row.append(`#${env.seq}  ${time}  `, type, `  ${JSON.stringify(env.data)}`);
    if (env.type.endsWith('_FAILED')) row.className = 'error';
    $('ws').prepend(row);
  }

  function onMessage(raw) {
    let env;
    try {
      env = JSON.parse(raw);
    } catch (e) {
      prepend('ws', `не JSON: ${raw}`, true);
      return;
    }
    showEnvelope(env);
    apply(env);
    render();
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws/events`);
    ws.onopen = () => {
      $('status').textContent = '● ws connected';
      $('status').className = 'on';
    };
    ws.onclose = () => {
      $('status').textContent = '● ws disconnected';
      $('status').className = 'off';
      setTimeout(connect, 1000);
    };
    ws.onmessage = msg => onMessage(msg.data);
  }

  render();
  connect();
</script>
</body>
</html>
