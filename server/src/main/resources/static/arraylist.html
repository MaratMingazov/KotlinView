<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ArrayList&lt;Int&gt; playground</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .controls { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .controls input { width: 60px; }
    .on { color: #2a2; }
    .off { color: #c33; }
    h3 { margin: 16px 0 4px; border-bottom: 1px solid #ccc; }
    .log { max-height: 40vh; overflow-y: auto; }
    .log div { white-space: pre-wrap; padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
    .error { color: #c33; }
    .type { font-weight: bold; }
    .state-row { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
    .state-row .id { width: 32px; }
    .method { padding: 0 6px; border: 1px solid #ccc; border-radius: 3px; }
    .method.active { background: #2a2; border-color: #2a2; color: #fff; }
    .method.failed { background: #c33; border-color: #c33; color: #fff; }
    .empty { color: #999; }
  </style>
</head>
<body>

<header>
  <h2>ArrayList&lt;Int&gt; playground</h2>
  <span id="status" class="off">● ws disconnected</span>
</header>

<div class="controls">
  <button id="create">create</button>
  <label>arrayListId <input id="arrayListId" type="number" value="1"></label>
  <span><button id="add">add</button>(value <input id="value" type="number" value="10">)</span>
  <span><button id="get">get</button>(index <input id="index" type="number" value="0">)</span>
  <button id="remove">remove</button>
  <button id="clear">clear logs</button>
</div>

<h3>State</h3>
<div id="state"></div>

<h3>HTTP</h3>
<div id="http" class="log"></div>

<h3>WebSocket</h3>
<div id="ws" class="log"></div>

<script>
  const $ = id => document.getElementById(id);
  const base = '/api/arraylistint';

  // Новые записи сверху
  function prepend(logId, text, isError) {
    const row = document.createElement('div');
    row.textContent = text;
    if (isError) row.className = 'error';
    $(logId).prepend(row);
  }

  // ---------- REST ----------

  async function call(method, url, body) {
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) options.body = JSON.stringify(body);
    const request = `${method} ${url}${body !== undefined ? ' ' + JSON.stringify(body) : ''}`;
    try {
      const res = await fetch(url, options);
      const text = await res.text(); // у 204 тела нет
      prepend('http', `${request} → ${res.status} ${text}`, !res.ok);
      return res.ok && text ? JSON.parse(text) : null;
    } catch (e) {
      prepend('http', `${request} → ${e}`, true);
      return null;
    }
  }

  const listId = () => $('arrayListId').value;
  const num = id => Number($(id).value);

  $('create').onclick = async () => {
    const response = await call('POST', base);
    if (response) $('arrayListId').value = response.arrayListId;
  };
  $('add').onclick = () => call('POST', `${base}/${listId()}/add`, { value: num('value') });
  $('get').onclick = () => call('POST', `${base}/${listId()}/get`, { index: num('index') });
  $('remove').onclick = () => call('DELETE', `${base}/${listId()}`);
  $('clear').onclick = () => { $('http').innerHTML = ''; $('ws').innerHTML = ''; };

  // ---------- State ----------

  const METHODS = ['add', 'get'];
  const lists = new Map(); // arrayListId → { id, elements, inside: { add: Set<thread>, get: Set<thread> }, failed: { add, get } }

  // Список создаётся и по CREATED, и по любому другому событию: страницу могли открыть уже после CREATED
  function listOf(id) {
    if (!lists.has(id)) {
      lists.set(id, { id, elements: [], inside: { add: new Set(), get: new Set() }, failed: { add: false, get: false } });
    }
    return lists.get(id);
  }

  function apply(env) {
    if (env.type === 'ARRAY_LIST_INT_CREATED') { listOf(env.data.arrayListId); return; }
    if (env.type === 'ARRAY_LIST_INT_REMOVED') { lists.delete(env.data.arrayListId); return; }

    // ARRAY_LIST_INT_ADD_IN, ARRAY_LIST_INT_GET_OUT_FAILED, ...
    const match = env.type.match(/^ARRAY_LIST_INT_(ADD|GET)_(IN|OUT|OUT_FAILED)$/);
    if (!match) return;
    const method = match[1].toLowerCase();
    const phase = match[2];
    const list = listOf(env.data.arrayListId);
    list.elements = env.data.elements;

    // Внутри метода может быть несколько потоков сразу: подсветка горит, пока не вышел последний
    if (phase === 'IN') list.inside[method].add(env.data.thread);
    else list.inside[method].delete(env.data.thread);

    if (phase === 'OUT_FAILED') {
      list.failed[method] = true;
      setTimeout(() => { list.failed[method] = false; render(); }, 1000);
    }
  }

  function render() {
    const root = $('state');
    root.innerHTML = '';
    if (lists.size === 0) {
      root.innerHTML = '<div class="empty">нет списков</div>';
      return;
    }
    for (const list of [...lists.values()].sort((a, b) => a.id - b.id)) {
      const row = document.createElement('div');
      row.className = 'state-row';

      const id = document.createElement('span');
      id.className = 'id';
      id.textContent = `#${list.id}`;
      row.append(id);

      for (const method of METHODS) {
        const threads = list.inside[method];
        const el = document.createElement('span');
        el.className = 'method' + (threads.size > 0 ? ' active' : '') + (list.failed[method] ? ' failed' : '');
        el.textContent = method + (threads.size > 1 ? ` ×${threads.size}` : '');
        el.title = threads.size > 0 ? [...threads].join('\n') : '';
        row.append(el);
      }

      row.append(`[${list.elements.join(', ')}]`);
      root.append(row);
    }
  }

  // ---------- WebSocket ----------

  function showEnvelope(env) {
    const row = document.createElement('div');
    const type = document.createElement('span');
    type.className = 'type';
    type.textContent = env.type;
    row.append(`#${env.seq} `, type, ` ${JSON.stringify(env.data)}`);
    if (env.type.endsWith('_FAILED')) row.className = 'error';
    $('ws').prepend(row);
  }

  function onMessage(raw) {
    let env;
    try {
      env = JSON.parse(raw);
    } catch (e) {
      prepend('ws', `не JSON: ${raw}`, true);
      return;
    }
    showEnvelope(env);
    apply(env);
    render();
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws/events`);
    ws.onopen = () => {
      $('status').textContent = '● ws connected';
      $('status').className = 'on';
    };
    ws.onclose = () => {
      $('status').textContent = '● ws disconnected';
      $('status').className = 'off';
      setTimeout(connect, 1000);
    };
    ws.onmessage = msg => onMessage(msg.data);
  }

  render();
  connect();
</script>
</body>
</html>
