<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ArrayList&lt;Int&gt; playground</title>
  <!-- Сначала общий каркас и компоненты: стили страницы ниже могут их уточнять -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="arraylist.css">
</head>
<body>

<header>
  <h2>ArrayList&lt;Int&gt; playground</h2>
  <span id="status" class="off">● ws disconnected</span>
</header>

<button id="create" class="primary" title="POST /api/arraylistint — создать ArrayList&lt;Int&gt;; карточка появится по событию CREATED">+ new list</button>

<!-- Карточка на каждый список: слева управляем им, справа смотрим результат -->
<div id="lists"></div>

<h3>HTTP <button class="link" id="clearHttp">clear</button></h3>
<div id="http" class="log"></div>

<h3>WebSocket <button class="link" id="clearWs">clear</button></h3>
<div id="ws" class="log"></div>

<script src="base.js"></script>
<script src="components.js"></script>
<script src="arraylist.js"></script>
<script>
  // Модель, отрисовка состояния и REST — в arraylist.js; здесь только кнопка создания и карточки
  const { $ } = UI;
  const View = ArrayListView;

  // Карточку создаёт не ответ на create, а событие OBJECT_CREATED — так же, как для списков, созданных извне
  $('create').onclick = () => View.create();

  const store = View.createStore(render);

  // Карточка создаётся один раз: пульт не пересоздаётся, поэтому введённые значения и фокус не теряются
  function createCard(list) {
    const card = KV.el('div', 'list-card');
    const controls = KV.el('div', 'card-controls');
    const remove = KV.el('button', 'danger', 'remove list');
    remove.onclick = () => View.remove(store, list.id);
    controls.append(KV.el('div', 'card-title', `list #${list.id}`), KV.renderOps(View.operations, list.id), remove);
    const state = KV.el('div', 'card-state');
    card.append(controls, state);
    return { card, state };
  }

  // Карточка на каждый объект, по порядку id: пульт создаётся один раз, состояние справа перерисовывается
  const cards = UI.cardList('lists', {
    create: createCard,
    update: (list, { state }) => state.replaceChildren(...View.renderState(store, list)),
    empty: 'no lists — press «+ new list»',
  });

  function render() {
    cards.sync(store.items);
  }

  // Подключение, лог событий и переподключение — UI.connect из base.js
  render();
  UI.connect({ onEnvelope: env => { store.apply(env); render(); }, types: View.types });
</script>
</body>
</html>
