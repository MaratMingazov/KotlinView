<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ArrayList&lt;Int&gt; playground</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .controls { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .controls input { width: 60px; }
    .on { color: #2a2; }
    .off { color: #c33; }
    h3 { margin: 16px 0 4px; border-bottom: 1px solid #ccc; }
    .log { max-height: 40vh; overflow-y: auto; }
    .log div { white-space: pre-wrap; padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
    .error { color: #c33; }
    .type { font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h2>ArrayList&lt;Int&gt; playground</h2>
  <span id="status" class="off">● ws disconnected</span>
</header>

<div class="controls">
  <button id="create">create</button>
  <label>arrayListId <input id="arrayListId" type="number" value="1"></label>
  <span><label>value <input id="value" type="number" value="10"></label> <button id="add">add</button></span>
  <span><label>index <input id="index" type="number" value="0"></label> <button id="get">get</button></span>
  <button id="remove">remove</button>
  <button id="clear">clear</button>
</div>

<h3>HTTP</h3>
<div id="http" class="log"></div>

<h3>WebSocket</h3>
<div id="ws" class="log"></div>

<script>
  const $ = id => document.getElementById(id);
  const base = '/api/arraylistint';

  // Новые записи сверху
  function prepend(logId, text, isError) {
    const row = document.createElement('div');
    row.textContent = text;
    if (isError) row.className = 'error';
    $(logId).prepend(row);
  }

  // ---------- REST ----------

  async function call(method, url, body) {
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) options.body = JSON.stringify(body);
    const request = `${method} ${url}${body !== undefined ? ' ' + JSON.stringify(body) : ''}`;
    try {
      const res = await fetch(url, options);
      const text = await res.text(); // у 204 тела нет
      prepend('http', `${request} → ${res.status} ${text}`, !res.ok);
      return res.ok && text ? JSON.parse(text) : null;
    } catch (e) {
      prepend('http', `${request} → ${e}`, true);
      return null;
    }
  }

  const listId = () => $('arrayListId').value;
  const num = id => Number($(id).value);

  $('create').onclick = async () => {
    const response = await call('POST', base);
    if (response) $('arrayListId').value = response.arrayListId;
  };
  $('add').onclick = () => call('POST', `${base}/${listId()}/add`, { value: num('value') });
  $('get').onclick = () => call('POST', `${base}/${listId()}/get`, { index: num('index') });
  $('remove').onclick = () => call('DELETE', `${base}/${listId()}`);
  $('clear').onclick = () => { $('http').innerHTML = ''; $('ws').innerHTML = ''; };

  // ---------- WebSocket ----------

  function showEnvelope(raw) {
    const row = document.createElement('div');
    try {
      const env = JSON.parse(raw);
      const type = document.createElement('span');
      type.className = 'type';
      type.textContent = env.type;
      row.append(`#${env.seq} `, type, ` ${JSON.stringify(env.data)}`);
      if (env.type.endsWith('_FAILED')) row.className = 'error';
    } catch (e) {
      row.textContent = `не JSON: ${raw}`;
      row.className = 'error';
    }
    $('ws').prepend(row);
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws/events`);
    ws.onopen = () => {
      $('status').textContent = '● ws connected';
      $('status').className = 'on';
    };
    ws.onclose = () => {
      $('status').textContent = '● ws disconnected';
      $('status').className = 'off';
      setTimeout(connect, 1000);
    };
    ws.onmessage = msg => showEnvelope(msg.data);
  }

  connect();
</script>
</body>
</html>
