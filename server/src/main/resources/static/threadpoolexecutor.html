<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ThreadPoolExecutor playground</title>
  <!-- Сначала общий каркас и компоненты: стили страницы ниже могут их уточнять -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="pool.css">
  <link rel="stylesheet" href="synchronousqueue.css">
  <style>
    /* Палитра, шапка, кнопки, карточка, логи — в base.css; состояние пула — в pool.css */

    .create { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .create.presets { margin-top: 6px; }
    .config .preset { color: var(--keyword); }

    /* --- карточка пула: .list-card из base.css; под заголовком пометка пресета --- */
    .card-title { color: var(--keyword); margin-bottom: 2px; }
    .config { color: var(--dim); margin-bottom: 8px; }
  </style>
</head>
<body>

<header>
  <h2>ThreadPoolExecutor playground</h2>
  <span id="status" class="off">● ws disconnected</span>
</header>

<!-- Значения по умолчанию подобраны так, что пять execute подряд проходят все ветки:
     новый поток, очередь, поток сверх core, отказ, а потом смерть лишнего потока по keepAlive -->
<div class="create">
  <span>core <input id="core" type="number" value="1" min="0"></span>
  <span>max <input id="max" type="number" value="2" min="1"></span>
  <span>keepAlive, сек <input id="keepAlive" type="number" value="3" min="0" step="0.5"></span>
  <span>queue capacity <input id="capacity" type="number" value="1" min="1" required title="ёмкость очереди — обязательна, чтобы было видно свободные места"></span>
  <button id="create" class="primary" title="POST /api/threadpoolexecutor — создать пул вместе с его очередью и фабрикой; карточка появится по событию OBJECT_CREATED">+ new pool</button>
</div>

<!-- Готовые конфигурации того же пула, как в java.util.concurrent.Executors -->
<div class="create presets">
  <span class="empty">Executors:</span>
  <span>newFixedThreadPool( <input id="nThreads" type="number" value="2" min="1"> )
    <button id="createFixed" class="primary" title="POST /api/threadpoolexecutor/fixed {nThreads} — core = max = n, keepAlive 0, очередь на 5 (в JDK — неограниченная)">+ fixed</button></span>
  <button id="createSingle" class="primary" title="POST /api/threadpoolexecutor/single — fixed(1): один поток, задачи строго по очереди; очередь на 5 (в JDK — неограниченная)">+ newSingleThreadExecutor()</button>
  <button id="createCached" class="primary" title="POST /api/threadpoolexecutor/cached — core 0, SynchronousQueue: a task goes to an idle worker or a new thread; max 5 threads, keepAlive 10 s (JDK: unbounded, 60 s)">+ newCachedThreadPool()</button>
</div>

<!-- Карточка на каждый пул: слева управляем им, справа смотрим результат -->
<div id="pools"></div>

<h3>HTTP <button class="link" id="clearHttp">clear</button></h3>
<div id="http" class="log"></div>

<h3>WebSocket <button class="link" id="clearWs">clear</button></h3>
<div id="ws" class="log"></div>

<script src="base.js"></script>
<script src="components.js"></script>
<script src="synchronousqueue.js"></script>
<script src="pool.js"></script>
<script>
  // Модель, отрисовка состояния пула и REST — в pool.js; здесь только форма создания и карточки
  const { $ } = UI;
  const { api, titles } = Pool;

  // Карточку создаёт не ответ на create, а событие OBJECT_CREATED — так же, как для пулов, созданных извне
  // Ёмкость обязательна: пустое или < 1 поле не отправляем, браузер подсветит его и покажет подсказку
  $('create').onclick = () => {
    const capacityInput = $('capacity');
    if (!capacityInput.reportValidity()) return;
    api.create({
      corePoolSize: Number($('core').value),
      maximumPoolSize: Number($('max').value),
      keepAliveMs: Math.round(Number($('keepAlive').value) * 1000),
      queueCapacity: Number(capacityInput.value),
    });
  };
  $('createFixed').onclick = () => api.createFixed(Number($('nThreads').value));
  $('createCached').onclick = () => api.createCached();
  $('createSingle').onclick = () => api.createSingle();

  const store = Pool.createStore(render);

  // ---------- Карточка пула: пульт слева ----------

  const OPERATIONS = ['execute', 'shutdown', 'shutdownNow'];

  // Карточка создаётся один раз: пульт не пересоздаётся
  function createCard(pool) {
    const id = pool.id;
    const s = pool.state;
    const card = KV.el('div', 'list-card');
    card.dataset.id = id;

    const controls = KV.el('div', 'card-controls');
    // Конфиг пула (core / max / keepAlive / queue) пока не выводим — минималистичный дизайн.
    // Остаётся только пометка пресета Executors. Конфиг не меняется — рисуем один раз
    const config = KV.el('div', 'config');
    const preset = s && Pool.presetOf(s, store.queueCapacity(s.queueId));
    if (preset) config.append(KV.el('span', 'preset', `= Executors.${preset}`));
    controls.append(KV.el('div', 'card-title', `pool #${id}`), config);

    const ops = KV.el('div', 'ops');
    for (const op of OPERATIONS) {
      const run = KV.el('button', 'run', '▶');
      run.title = titles[op](id);
      run.onclick = () => api[op](id);
      ops.append(KV.el('span', 'name', op), KV.el('span', 'args'), run);
    }

    const remove = KV.el('button', 'danger', 'remove pool');
    remove.title = titles.remove(id);
    remove.onclick = async () => { await api.remove(store, id); render(); };
    controls.append(ops, remove);

    const state = KV.el('div', 'card-state');
    card.append(controls, state);
    return { card, state };
  }

  // ---------- Синхронизация карточек с состоянием ----------

  // Карточка на каждый объект, по порядку id: пульт создаётся один раз, состояние справа перерисовывается
  const cards = UI.cardList('pools', {
    create: createCard,
    update: (pool, { state }) => state.replaceChildren(...Pool.renderState(store, pool)),
    empty: 'no pools — press «+ new pool»',
  });

  function render() {
    cards.sync(store.pools);
  }

  // ---------- WebSocket ----------
  // Подключение, лог событий и переподключение — UI.connect из base.js

  render();
  UI.connect({ onEnvelope: env => { store.apply(env); render(); }, types: Pool.TYPES });
</script>
</body>
</html>
