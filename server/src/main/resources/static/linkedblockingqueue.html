<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LinkedBlockingQueue&lt;Runnable&gt; playground</title>
  <style>
    /* Палитра как в arraylist-ide.html (IntelliJ Darcula) */
    :root {
      --bg: #1e1f22; --panel: #2b2d30; --border: #3c3f41; --text: #bcbec4; --dim: #6f737a;
      --keyword: #cf8e6d; --fn: #56a8f5; --num: #2aacb8; --str: #6aab73;
      --in: #56a8f5; --out: #6aab73; --fail: #f75464;
    }
    body {
      font: 13px/1.5 "JetBrains Mono", ui-monospace, Menlo, monospace; margin: 16px;
      background: var(--bg); color: var(--text);
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    h2 { color: var(--keyword); font-weight: normal; }
    h3 {
      margin: 16px 0 4px; border-bottom: 1px solid var(--border); color: var(--dim); font-weight: normal;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .on { color: var(--out); }
    .off { color: var(--fail); }
    .empty { color: var(--dim); }

    /* --- кнопки и поля --- */
    button {
      background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
      color: var(--fn); font: inherit; padding: 0 8px; cursor: pointer;
    }
    button:hover { border-color: currentColor; }
    button.primary { color: var(--out); padding: 2px 12px; }
    button.run { color: var(--out); }
    button.danger { color: var(--fail); }
    button.link { background: none; border: none; color: var(--dim); padding: 0; }
    button.link:hover { color: var(--text); }
    input {
      width: 64px; background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
      color: var(--num); font: inherit; padding: 0 4px;
    }
    input::placeholder { color: var(--dim); }

    /* --- карточка очереди: слева её пульт, справа её состояние (как .list-card в linkedlist.html) --- */
    .list-card {
      display: grid; grid-template-columns: minmax(300px, 1fr) 2fr; gap: 24px; align-items: start;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    @media (max-width: 800px) { .list-card { grid-template-columns: 1fr; } }
    .card-title { color: var(--keyword); margin-bottom: 6px; }
    .card-title .capacity { color: var(--dim); }
    /* Сетка пульта: метод | поля | ▶ — кнопки запуска выровнены в столбик */
    .ops { display: grid; grid-template-columns: max-content max-content max-content; gap: 6px 10px; align-items: center; }
    .ops .name { color: var(--fn); }
    .ops .args { display: flex; gap: 4px; }
    .card-controls .danger { margin-top: 10px; }

    /* Бейджи методов и цепочка узлов — в components.css */

    /* --- состояние: потоки, которые висят внутри take(). Есть только у блокирующей очереди --- */
    .waiting { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; min-height: 22px; }
    .thread-chip {
      padding: 0 6px; border-radius: 3px; font-weight: bold; color: var(--thread);
      border: 1px solid color-mix(in srgb, var(--thread) 60%, transparent);
      background: color-mix(in srgb, var(--thread) 15%, transparent);
    }

    /* --- логи --- */
    .log { max-height: 40vh; overflow-y: auto; }
    .log div { white-space: pre-wrap; padding: 2px 0; border-bottom: 1px solid var(--panel); }
    .error { color: var(--fail); }
    .type { font-weight: bold; color: var(--fn); }
  </style>
  <link rel="stylesheet" href="components.css">
</head>
<body>

<header>
  <h2>LinkedBlockingQueue&lt;Runnable&gt; playground</h2>
  <span id="status" class="off">● ws disconnected</span>
</header>

<div>
  capacity <input id="capacity" type="number" value="3" min="1">
  <button id="create" class="primary" title="POST /api/linkedblockingqueuerunnable — создать очередь; карточка появится по событию OBJECT_CREATED">+ new queue</button>
</div>

<!-- Карточка на каждую очередь: слева управляем ей, справа смотрим результат -->
<div id="lists"></div>

<h3>HTTP <button class="link" id="clearHttp">clear</button></h3>
<div id="http" class="log"></div>

<h3>WebSocket <button class="link" id="clearWs">clear</button></h3>
<div id="ws" class="log"></div>

<script src="components.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const base = '/api/linkedblockingqueuerunnable';
  const tasksBase = '/api/tasks';
  const QUEUE = 'LINKED_BLOCKING_QUEUE_RUNNABLE';
  const TASK = 'RUNNABLE_TASK';
  const INT_MAX = 2147483647; // ёмкость LinkedBlockingQueue() без аргумента

  // Новые записи сверху
  function prepend(logId, text, isError) {
    const row = document.createElement('div');
    row.textContent = text;
    if (isError) row.className = 'error';
    $(logId).prepend(row);
  }

  // ---------- REST ----------

  async function call(method, url, body) {
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) options.body = JSON.stringify(body);
    const request = `${method} ${url}${body !== undefined ? ' ' + JSON.stringify(body) : ''}`;
    try {
      const res = await fetch(url, options);
      const text = await res.text(); // у 204 тела нет
      prepend('http', `${request} → ${res.status} ${text}`, !res.ok);
      return res.ok && text ? JSON.parse(text) : null;
    } catch (e) {
      prepend('http', `${request} → ${e}`, true);
      return null;
    }
  }

  // offer новой задачи — два обычных запроса подряд: сервер не знает такой команды, offer принимает только taskId.
  // Поэтому в логе честно видно: сначала OBJECT_CREATED задачи, потом offer. offer по taskId добавим позже
  async function offerNew(queueId, durationMs) {
    const created = await call('POST', tasksBase, { durationMs });
    if (created) await call('POST', `${base}/${queueId}/offer`, { taskId: created.objectId });
  }

  // Карточку создаёт не ответ на create, а событие OBJECT_CREATED — так же, как для очередей, созданных извне
  $('create').onclick = () => call('POST', base, { capacity: Number($('capacity').value) });
  $('clearHttp').onclick = () => { $('http').innerHTML = ''; };
  $('clearWs').onclick = () => { $('ws').innerHTML = ''; };

  // ---------- State ----------

  const METHODS = ['offer', 'take'];

  // taskId → durationMs. Задачи нужны только ради длительности в подсказке узла
  const durations = new Map();

  // objectId → { id, capacity, elements, methods, nodeEffect }
  // elements — taskIds от головы к хвосту. methods — KV.methodsState: кто внутри какого метода и затухание бейджей.
  // methods.inside.take — заодно и «ждут в take»: поток внутри take() висит, пока очередь пуста
  const lists = new Map();

  // Очередь создаётся и по CREATED, и по любому другому событию: страницу могли открыть уже после CREATED
  function listOf(id) {
    if (!lists.has(id)) lists.set(id, { id, capacity: null, elements: [], methods: KV.methodsState(METHODS), nodeEffect: null });
    return lists.get(id);
  }

  function apply(env) {
    const data = env.data;
    if (data?.objectType === TASK) {
      if (env.type === 'OBJECT_REMOVED') durations.delete(data.objectId);
      else if (data.state?.durationMs !== undefined) durations.set(data.objectId, data.state.durationMs);
      return;
    }
    if (data?.objectType !== QUEUE) return;
    if (env.type === 'OBJECT_REMOVED') { lists.delete(data.objectId); return; }

    // Порядок METHOD_OUT offer и take может перепутаться (TODO на сервере), но state в каждом событии полный —
    // поэтому просто берём последний
    const list = listOf(data.objectId);
    if (data.state) {
      list.capacity = data.state.capacity;
      list.elements = data.state.taskIds;
    }

    const phase = KV.trackMethod(list.methods, env);
    if (!phase) return;
    const effect = nodeEffectOf(data.method, phase, data);
    if (effect) KV.setEffect(list, effect, render); // перерисовать, когда призрак догорит
  }

  // Что подсветить после этого события (null — ничего). Как в linkedlist.html: offer ≈ offer, take ≈ pop.
  // side — с какой стороны цепочки призрак: take снимает с головы, отклонённый offer не попал в хвост
  function nodeEffectOf(method, phase, data) {
    if (phase === 'OUT_FAILED') {
      return method === 'take' ? { ghost: '✗', kind: 'failed', side: 'head', title: `${data.thread}: ${data.error}` } : null;
    }
    if (phase !== 'OUT') return null;
    if (method === 'offer') {
      // При гонке «последний узел» — допущение, а не наблюдение
      if (data.result === true) return { new: data.state.taskIds.length - 1 };
      return { ghost: `#${data.args.taskId}`, kind: 'failed', side: 'tail', title: `очередь полна: offer вернул false` };
    }
    // Снятого узла в state уже нет — его taskId берём из result
    if (method === 'take') return { ghost: `#${data.result}`, kind: 'removed', side: 'head', title: `взял ${data.thread}` };
    return null;
  }

  // ---------- Карточка очереди: пульт слева ----------

  // Операции пульта: имя, поля (placeholder + значение по умолчанию) и что вызвать
  const OPERATIONS = [
    { name: 'offer', fields: [['сек', 5]], title: id => `POST ${tasksBase} {durationMs}, затем POST ${base}/${id}/offer {taskId} — новая задача`,
      run: (id, inputs) => offerNew(id, Math.round(Number(inputs['сек'].value) * 1000)) },
    { name: 'take', fields: [], title: id => `POST ${base}/${id}/take — take() в новом потоке`,
      run: id => call('POST', `${base}/${id}/take`) },
  ];

  const capacityText = capacity => capacity === null ? '?' : capacity === INT_MAX ? '∞' : capacity;

  // Карточка создаётся один раз: поля пульта не пересоздаются, поэтому введённое значение и фокус не теряются
  function createCard(list) {
    const id = list.id;
    const card = document.createElement('div');
    card.className = 'list-card';
    card.dataset.id = id;

    const controls = document.createElement('div');
    controls.className = 'card-controls';
    const title = Object.assign(document.createElement('div'), { className: 'card-title', textContent: `queue #${id} ` });
    // Ёмкость здесь, а не в состоянии: без неё непонятно, почему offer вернул false
    title.append(Object.assign(document.createElement('span'), { className: 'capacity', textContent: `· capacity ${capacityText(list.capacity)}` }));
    controls.append(title);

    const ops = document.createElement('div');
    ops.className = 'ops';
    for (const op of OPERATIONS) {
      const name = Object.assign(document.createElement('span'), { className: 'name', textContent: op.name });
      const args = Object.assign(document.createElement('span'), { className: 'args' });
      const inputs = {};
      for (const [field, defaultValue] of op.fields) {
        const input = Object.assign(document.createElement('input'), { type: 'number', value: defaultValue, placeholder: field, title: field });
        input.setAttribute('aria-label', field);
        inputs[field] = input;
        args.append(input);
      }
      const run = Object.assign(document.createElement('button'), { className: 'run', textContent: '▶', title: op.title(id) });
      run.onclick = () => op.run(id, inputs);
      // Enter в поле строки — то же, что ▶
      for (const input of Object.values(inputs)) input.addEventListener('keydown', e => { if (e.key === 'Enter') run.click(); });
      ops.append(name, args, run);
    }

    const remove = Object.assign(document.createElement('button'), { className: 'danger', textContent: 'remove queue' });
    remove.onclick = () => call('DELETE', `${base}/${id}`);

    controls.append(ops, remove);

    const state = document.createElement('div');
    state.className = 'card-state';

    card.append(controls, state);
    return { card, state };
  }

  // ---------- Карточка очереди: состояние справа ----------
  // Бейджи и цепочка — общие компоненты из components.js

  // Значение узла — id задачи, длительность — в подсказке
  function taskNode(taskId, label, index) {
    const el = KV.node(`#${taskId}`, label, index);
    el.title = `task#${taskId}, ${KV.seconds(durations.get(taskId))}`;
    return el;
  }

  // Есть только у блокирующей очереди: в общий компонент цепочки не входит
  function renderWaiting(list) {
    const row = document.createElement('div');
    row.className = 'waiting';
    row.append(Object.assign(document.createElement('span'), { className: 'empty', textContent: 'ждут в take:' }));
    const threads = list.methods.inside.take;
    if (threads.size === 0) row.append(Object.assign(document.createElement('span'), { className: 'empty', textContent: '—' }));
    for (const thread of threads) {
      const chip = Object.assign(document.createElement('span'), { className: 'thread-chip', textContent: thread });
      chip.style.setProperty('--thread', KV.threadColor(thread));
      chip.title = `${thread} внутри take(): ждёт, пока в очереди появится задача`;
      row.append(chip);
    }
    return row;
  }

  // ---------- Синхронизация карточек с состоянием ----------

  const cards = new Map(); // objectId → { card, state }

  function render() {
    const root = $('lists');

    // Удалить карточки исчезнувших очередей
    for (const [id, { card }] of cards) {
      if (!lists.has(id)) { card.remove(); cards.delete(id); }
    }

    // Создать карточки новых очередей — по порядку id
    for (const list of [...lists.values()].sort((a, b) => a.id - b.id)) {
      if (!cards.has(list.id)) {
        const created = createCard(list);
        cards.set(list.id, created);
        const next = [...root.querySelectorAll('.list-card')].find(c => Number(c.dataset.id) > list.id);
        root.insertBefore(created.card, next ?? null);
      }
      // Пульт не трогаем — перерисовываем только правую часть
      const { state } = cards.get(list.id);
      state.replaceChildren(KV.renderBadges(list.methods), KV.renderChain(list.elements, list.nodeEffect, { node: taskNode }), renderWaiting(list));
    }

    const placeholder = root.querySelector('.empty-lists');
    if (lists.size === 0 && !placeholder) {
      root.innerHTML = '<div class="empty empty-lists">нет очередей — нажмите «+ new queue»</div>';
    } else if (lists.size > 0 && placeholder) {
      placeholder.remove();
    }
  }

  // ---------- WebSocket ----------

  function showEnvelope(env) {
    const type = env.data?.objectType;
    if (type !== QUEUE && type !== TASK) return; // чужие события (списки и т.п.) не засоряют лог
    const row = document.createElement('div');
    const typeEl = document.createElement('span');
    typeEl.className = 'type';
    typeEl.textContent = env.type;
    const time = new Date(env.ts).toISOString().slice(11, 23); // HH:MM:SS.mmm, UTC
    row.append(`#${env.seq}  ${time}  `, typeEl, `  ${JSON.stringify(env.data)}`);
    if (env.type.endsWith('_FAILED')) row.className = 'error';
    $('ws').prepend(row);
  }

  function onMessage(raw) {
    let env;
    try {
      env = JSON.parse(raw);
    } catch (e) {
      prepend('ws', `не JSON: ${raw}`, true);
      return;
    }
    showEnvelope(env);
    apply(env);
    render();
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws/events`);
    ws.onopen = () => {
      $('status').textContent = '● ws connected';
      $('status').className = 'on';
    };
    ws.onclose = () => {
      $('status').textContent = '● ws disconnected';
      $('status').className = 'off';
      setTimeout(connect, 1000);
    };
    ws.onmessage = msg => onMessage(msg.data);
  }

  render();
  connect();
</script>
</body>
</html>
