<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LinkedBlockingQueue&lt;Runnable&gt; playground</title>
  <style>
    /* Палитра как в arraylist-ide.html (IntelliJ Darcula) */
    :root {
      --bg: #1e1f22; --panel: #2b2d30; --border: #3c3f41; --text: #bcbec4; --dim: #6f737a;
      --keyword: #cf8e6d; --fn: #56a8f5; --num: #2aacb8; --str: #6aab73;
      --in: #56a8f5; --out: #6aab73; --fail: #f75464;
    }
    body {
      font: 13px/1.5 "JetBrains Mono", ui-monospace, Menlo, monospace; margin: 16px;
      background: var(--bg); color: var(--text);
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    h2 { color: var(--keyword); font-weight: normal; }
    h3 {
      margin: 16px 0 4px; border-bottom: 1px solid var(--border); color: var(--dim); font-weight: normal;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .on { color: var(--out); }
    .off { color: var(--fail); }
    .empty { color: var(--dim); }

    /* --- кнопки и поля --- */
    button {
      background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
      color: var(--fn); font: inherit; padding: 0 8px; cursor: pointer;
    }
    button:hover { border-color: currentColor; }
    button.primary { color: var(--out); padding: 2px 12px; }
    button.run { color: var(--out); }
    button.danger { color: var(--fail); }
    button.link { background: none; border: none; color: var(--dim); padding: 0; }
    button.link:hover { color: var(--text); }
    input {
      width: 64px; background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
      color: var(--num); font: inherit; padding: 0 4px;
    }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    .toolbar .title { color: var(--keyword); width: 64px; }

    /* --- полоса задач: из неё берём taskId для offer --- */
    .tasks { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 4px 74px; min-height: 40px; }
    .task-chip {
      display: flex; align-items: center; gap: 6px; padding: 2px 6px; cursor: pointer;
      border: 1px solid var(--border); border-radius: 4px; background: var(--panel);
    }
    .task-chip:hover { border-color: var(--fn); }
    .task-chip .cid { color: var(--keyword); }
    .task-chip .dur { color: var(--num); }
    /* Задача уже лежит в какой-то очереди — её всё равно можно положить ещё раз */
    .task-chip.queued { opacity: .5; }

    /* --- карточка очереди: слева пульт, справа состояние (как .list-card на страницах списков) --- */
    .queue-card {
      display: grid; grid-template-columns: minmax(320px, 1fr) 2fr; gap: 24px; align-items: start;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    @media (max-width: 800px) { .queue-card { grid-template-columns: 1fr; } }
    .card-title { color: var(--keyword); margin-bottom: 6px; }
    /* Сетка пульта: метод | поле | ▶ | подсказка */
    .ops { display: grid; grid-template-columns: max-content max-content max-content max-content; gap: 6px 10px; align-items: center; }
    .ops .name { color: var(--fn); }
    .card-controls .danger { margin-top: 10px; }

    /* --- состояние: бейджи методов --- */
    .badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: 22px; }
    .method { padding: 0 6px; border: 1px solid var(--border); border-radius: 3px; color: var(--dim); }
    .method.active { background: var(--out); border-color: var(--out); color: var(--bg); }
    /* Послесвечение: после OUT бейдж не гаснет мгновенно, а затухает, как лампа накаливания */
    @keyframes afterglow {
      from { background: var(--out); border-color: var(--out); color: var(--bg); }
      to { background: transparent; border-color: var(--border); color: var(--dim); }
    }
    @keyframes afterglow-failed {
      from { background: var(--fail); border-color: var(--fail); color: var(--bg); }
      to { background: transparent; border-color: var(--border); color: var(--dim); }
    }

    /* --- состояние: ячейки очереди head … tail --- */
    .line { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 8px; min-height: 66px; }
    .dir { color: var(--dim); font-size: 11px; padding: 16px 4px 0; }
    .slot { display: flex; flex-direction: column; align-items: center; }
    .slot .label { font-size: 11px; color: var(--keyword); height: 16px; }
    .cell {
      width: 56px; height: 40px; box-sizing: border-box; display: flex; flex-direction: column;
      align-items: center; justify-content: center; line-height: 1.2;
      border: 2px dashed var(--border); border-radius: 6px;
    }
    .cell.filled { border-style: solid; background: var(--panel); }
    .cell .cid { color: var(--keyword); }
    .cell .dur { color: var(--num); font-size: 11px; }
    /* Призраки: взятая take'ом задача у головы, отклонённая offer'ом — у хвоста */
    .cell.taken { border-color: var(--out); }
    .cell.taken .dur { color: var(--out); }
    .cell.rejected { border-color: var(--fail); }
    .cell.rejected .dur { color: var(--fail); }
    .size { color: var(--dim); padding: 16px 0 0 8px; }
    @keyframes cell-new {
      from { background: color-mix(in srgb, var(--out) 45%, var(--panel)); border-color: var(--out); }
      to { background: var(--panel); border-color: var(--border); }
    }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }

    /* --- состояние: потоки, которые висят внутри take() --- */
    .waiting { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; min-height: 22px; }
    .thread-chip {
      padding: 0 6px; border-radius: 3px; font-weight: bold; color: var(--thread);
      border: 1px solid color-mix(in srgb, var(--thread) 60%, transparent);
      background: color-mix(in srgb, var(--thread) 15%, transparent);
    }
    .thread-chip.failed { color: var(--fail); border-color: var(--fail); background: none; }

    /* --- логи --- */
    .log { max-height: 40vh; overflow-y: auto; }
    .log div { white-space: pre-wrap; padding: 2px 0; border-bottom: 1px solid var(--panel); }
    .error { color: var(--fail); }
    .type { font-weight: bold; color: var(--fn); }
  </style>
</head>
<body>

<header>
  <h2>LinkedBlockingQueue&lt;Runnable&gt; playground</h2>
  <span id="status" class="off">● ws disconnected</span>
</header>

<div class="toolbar">
  <span class="title">tasks</span>
  длительность, сек <input id="duration" type="number" value="5" min="1" step="0.5">
  <button id="createTask" class="primary" title="POST /api/tasks — создать задачу; она появится по событию OBJECT_CREATED">+ new task</button>
  <span class="empty">клик по задаче — подставить её id в offer</span>
</div>
<div id="tasks" class="tasks"></div>

<div class="toolbar">
  <span class="title">queues</span>
  capacity <input id="capacity" type="number" value="3" min="1">
  <button id="createQueue" class="primary" title="POST /api/linkedblockingqueuerunnable — создать очередь; карточка появится по событию OBJECT_CREATED">+ new queue</button>
</div>

<!-- Карточка на каждую очередь: слева управляем ей, справа смотрим результат -->
<div id="queues"></div>

<h3>HTTP <button class="link" id="clearHttp">clear</button></h3>
<div id="http" class="log"></div>

<h3>WebSocket <button class="link" id="clearWs">clear</button></h3>
<div id="ws" class="log"></div>

<script>
  const $ = id => document.getElementById(id);
  const base = '/api/linkedblockingqueuerunnable';
  const tasksBase = '/api/tasks';
  const QUEUE = 'LINKED_BLOCKING_QUEUE_RUNNABLE';
  const TASK = 'RUNNABLE_TASK';
  const METHODS = ['offer', 'take'];
  const PHASE_BY_TYPE = { METHOD_IN: 'IN', METHOD_OUT: 'OUT', METHOD_OUT_FAILED: 'OUT_FAILED' };
  const INT_MAX = 2147483647;  // ёмкость LinkedBlockingQueue() без аргумента
  const MAX_DRAWN_CELLS = 20;  // больше — пустые ячейки не рисуем, только «n / capacity»
  const FADE_MS = 800;         // сколько затухает бейдж после выхода последнего потока
  const CELL_FADE_MS = 1500;   // подсветка новой ячейки и призраки — дольше, чтобы успеть рассмотреть
  const FAILED_FADE_MS = 4000; // упавший take — ещё дольше, чтобы успеть прочитать ошибку

  // Новые записи сверху
  function prepend(logId, text, isError) {
    const row = document.createElement('div');
    row.textContent = text;
    if (isError) row.className = 'error';
    $(logId).prepend(row);
  }

  // ---------- REST ----------

  async function call(method, url, body) {
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) options.body = JSON.stringify(body);
    const request = `${method} ${url}${body !== undefined ? ' ' + JSON.stringify(body) : ''}`;
    try {
      const res = await fetch(url, options);
      const text = await res.text(); // у 204 тела нет
      prepend('http', `${request} → ${res.status} ${text}`, !res.ok);
      return res.ok && text ? JSON.parse(text) : null;
    } catch (e) {
      prepend('http', `${request} → ${e}`, true);
      return null;
    }
  }

  const durationMsOf = input => Math.round(Number(input.value) * 1000);

  // «offer new» — два обычных запроса подряд: сервер не знает такой команды, offer принимает только taskId.
  // Поэтому в логе честно видно: сначала OBJECT_CREATED задачи, потом offer
  async function offerNew(queueId, durationMs) {
    const created = await call('POST', tasksBase, { durationMs });
    if (created) await call('POST', `${base}/${queueId}/offer`, { taskId: created.objectId });
  }

  // Карточки создаёт не ответ на create, а событие OBJECT_CREATED — так же, как для объектов, созданных извне
  $('createTask').onclick = () => call('POST', tasksBase, { durationMs: durationMsOf($('duration')) });
  $('createQueue').onclick = () => call('POST', base, { capacity: Number($('capacity').value) });
  $('clearHttp').onclick = () => { $('http').innerHTML = ''; };
  $('clearWs').onclick = () => { $('ws').innerHTML = ''; };

  // ---------- Состояние ----------

  // taskId → { id, durationMs }. Задачи нужны только ради длительности в ячейках и полосы задач
  const tasks = new Map();
  let lastTaskId = null; // последний созданный — подставляется в поле offer

  // queueId → {
  //   id, capacity, taskIds,                      — из state любого события очереди
  //   inside: { method: Set<thread> },            — кто сейчас внутри метода (для бейджей)
  //   fade: { method: { start, failed } },        — затухание бейджа после выхода последнего потока
  //   waiting: Map<thread, { failed, error, endedAt }>  — потоки внутри take(); упавшие тают
  //   ghosts: [{ side: 'head'|'tail', kind: 'taken'|'rejected', taskId, text, start }]
  //   added: { index, start } | null              — подсветка ячейки после успешного offer
  // }
  const queues = new Map();

  function taskOf(id) {
    if (!tasks.has(id)) tasks.set(id, { id, durationMs: null });
    return tasks.get(id);
  }

  // Очередь создаётся и по OBJECT_CREATED, и по любому METHOD_*: страницу могли открыть уже после создания
  function queueOf(id) {
    if (!queues.has(id)) {
      queues.set(id, {
        id, capacity: null, taskIds: [],
        inside: Object.fromEntries(METHODS.map(m => [m, new Set()])),
        fade: Object.fromEntries(METHODS.map(m => [m, { start: null, failed: false }])),
        waiting: new Map(), ghosts: [], added: null,
      });
    }
    return queues.get(id);
  }

  function apply(env) {
    const d = env.data;
    if (d?.objectType === TASK) applyTask(env, d);
    if (d?.objectType === QUEUE) applyQueue(env, d);
  }

  function applyTask(env, d) {
    if (env.type === 'OBJECT_REMOVED') { tasks.delete(d.objectId); return; }
    const task = taskOf(d.objectId);
    if (d.state?.durationMs !== undefined) task.durationMs = d.state.durationMs;
    if (env.type === 'OBJECT_CREATED') {
      lastTaskId = d.objectId;
      fillOfferInputs(d.objectId);
    }
  }

  function applyQueue(env, d) {
    if (env.type === 'OBJECT_REMOVED') { queues.delete(d.objectId); return; }
    const queue = queueOf(d.objectId);
    // Порядок METHOD_OUT offer и take может перепутаться (TODO на сервере), но state в каждом событии полный —
    // поэтому просто берём последний
    if (d.state) {
      queue.capacity = d.state.capacity;
      queue.taskIds = d.state.taskIds;
    }

    const phase = PHASE_BY_TYPE[env.type];
    if (!phase || !METHODS.includes(d.method)) return;
    const method = d.method;

    // Бейдж: горит, пока внутри есть потоки, потом затухает
    const inside = queue.inside[method];
    const fade = queue.fade[method];
    if (phase === 'IN') {
      if (inside.size === 0) queue.fade[method] = { start: null, failed: false }; // зажгли заново
      inside.add(d.thread);
    } else {
      inside.delete(d.thread);
      fade.failed ||= phase === 'OUT_FAILED'; // ошибку запоминаем, даже если внутри ещё есть потоки
      if (inside.size === 0) fade.start = performance.now();
    }

    if (method === 'take') applyTake(queue, phase, d);
    if (method === 'offer') applyOffer(queue, phase, d);
  }

  // Главное на странице: поток висит в take(), пока очередь пуста
  function applyTake(queue, phase, d) {
    if (phase === 'IN') {
      queue.waiting.set(d.thread, { failed: false, error: null, endedAt: null });
    } else if (phase === 'OUT') {
      queue.waiting.delete(d.thread);
      addGhost(queue, { side: 'head', kind: 'taken', taskId: d.result, text: `→ ${d.thread}` });
    } else {
      // Упавший поток не исчезает сразу — краснеет и тает, если за это время тот же поток не зашёл снова
      const endedAt = performance.now();
      queue.waiting.set(d.thread, { failed: true, error: d.error, endedAt });
      setTimeout(() => {
        if (queue.waiting.get(d.thread)?.endedAt === endedAt) { queue.waiting.delete(d.thread); render(); }
      }, FAILED_FADE_MS);
    }
  }

  function applyOffer(queue, phase, d) {
    if (phase !== 'OUT') return;
    if (d.result === true) {
      // При гонке «последняя ячейка» — допущение, а не наблюдение
      queue.added = { index: queue.taskIds.length - 1, start: performance.now() };
      setTimeout(render, CELL_FADE_MS);
    } else {
      addGhost(queue, { side: 'tail', kind: 'rejected', taskId: d.args.taskId, text: '✗ full' });
    }
  }

  function addGhost(queue, ghost) {
    queue.ghosts.push({ ...ghost, start: performance.now() });
    setTimeout(() => {
      queue.ghosts = queue.ghosts.filter(g => performance.now() - g.start < CELL_FADE_MS);
      render();
    }, CELL_FADE_MS);
  }

  // ---------- Отрисовка: полоса задач ----------

  const seconds = ms => ms == null ? '?' : (ms / 1000).toFixed(1) + 's';

  // Стабильный цвет для имени потока
  function threadColor(name) {
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return `hsl(${h}, 60%, 65%)`;
  }

  const el = (tag, className, textContent) => Object.assign(document.createElement(tag), { className: className ?? '', textContent: textContent ?? '' });

  function renderTasks() {
    const root = $('tasks');
    root.replaceChildren();
    if (tasks.size === 0) {
      root.append(el('span', 'empty', 'нет задач — «+ new task» или «offer new» в очереди'));
      return;
    }
    for (const task of [...tasks.values()].sort((a, b) => a.id - b.id)) {
      // В каких очередях лежит и сколько раз: одну задачу можно положить несколько раз
      const where = [...queues.values()]
        .map(q => [q.id, q.taskIds.filter(id => id === task.id).length])
        .filter(([, n]) => n > 0)
        .map(([id, n]) => `queue #${id}` + (n > 1 ? ` ×${n}` : ''));

      const chip = el('div', 'task-chip' + (where.length ? ' queued' : ''));
      chip.title = (where.length ? `лежит в ${where.join(', ')}\n` : '') + 'клик — подставить id в offer';
      chip.onclick = () => fillOfferInputs(task.id);
      const remove = el('button', 'link', '✕');
      remove.title = `DELETE ${tasksBase}/${task.id}`;
      remove.onclick = e => { e.stopPropagation(); call('DELETE', `${tasksBase}/${task.id}`); };
      chip.append(el('span', 'cid', `#${task.id}`), el('span', 'dur', seconds(task.durationMs)), remove);
      root.append(chip);
    }
  }

  // ---------- Отрисовка: карточка очереди, пульт слева ----------

  // queueId → { card, state, offerInput }
  const cards = new Map();

  function fillOfferInputs(taskId) {
    for (const { offerInput } of cards.values()) offerInput.value = taskId;
  }

  // Карточка создаётся один раз: поля пульта не пересоздаются, поэтому введённое значение и фокус не теряются
  function createCard(id) {
    const card = el('div', 'queue-card');
    card.dataset.id = id;

    const controls = el('div', 'card-controls');
    controls.append(el('div', 'card-title', `queue #${id}`));
    const ops = el('div', 'ops');

    // offer существующей задачи: можно положить одну и ту же задачу несколько раз
    const offerInput = Object.assign(document.createElement('input'), { type: 'number', value: lastTaskId ?? 1, min: 1, title: 'taskId' });
    const offerRun = el('button', 'run', '▶');
    offerRun.title = `POST ${base}/${id}/offer {taskId}`;
    offerRun.onclick = () => call('POST', `${base}/${id}/offer`, { taskId: Number(offerInput.value) });
    offerInput.addEventListener('keydown', e => { if (e.key === 'Enter') offerRun.click(); });
    ops.append(el('span', 'name', 'offer'), offerInput, offerRun, el('span', 'empty', 'taskId'));

    // offer new: создать задачу и сразу положить
    const newInput = Object.assign(document.createElement('input'), { type: 'number', value: $('duration').value, min: 1, step: 0.5, title: 'длительность, сек' });
    const newRun = el('button', 'run', '▶');
    newRun.title = `POST ${tasksBase} {durationMs}, затем POST ${base}/${id}/offer {taskId}`;
    newRun.onclick = () => offerNew(id, durationMsOf(newInput));
    newInput.addEventListener('keydown', e => { if (e.key === 'Enter') newRun.click(); });
    ops.append(el('span', 'name', 'offer new'), newInput, newRun, el('span', 'empty', 'сек'));

    // take: блокирующий, поэтому сервер запускает его в новом потоке taker-N
    const takeRun = el('button', 'run', '▶');
    takeRun.title = `POST ${base}/${id}/take — take() в новом потоке`;
    takeRun.onclick = () => call('POST', `${base}/${id}/take`);
    ops.append(el('span', 'name', 'take'), el('span'), takeRun, el('span', 'empty', 'каждый вызов — новый поток'));

    const remove = el('button', 'danger', 'remove queue');
    remove.title = `DELETE ${base}/${id}`;
    remove.onclick = () => call('DELETE', `${base}/${id}`);
    controls.append(ops, remove);

    const state = el('div', 'card-state');
    card.append(controls, state);
    return { card, state, offerInput };
  }

  // ---------- Отрисовка: карточка очереди, состояние справа ----------

  // Анимация, продолженная с того места, где она была до пересоздания элемента
  const continued = (name, durationMs, elapsed) => `${name} ${durationMs}ms ease-out ${-elapsed}ms forwards`;

  function renderBadges(queue) {
    const badges = el('div', 'badges');
    for (const method of METHODS) {
      const threads = queue.inside[method];
      const badge = el('span', 'method' + (threads.size > 0 ? ' active' : ''), method + (threads.size > 1 ? ` ×${threads.size}` : ''));
      // Бейдж пересоздаётся на каждый render. Отрицательная задержка продолжает затухание с того места, где оно было
      const { start, failed } = queue.fade[method];
      const elapsed = start === null ? Infinity : performance.now() - start;
      if (threads.size === 0 && elapsed < FADE_MS) badge.style.animation = continued(failed ? 'afterglow-failed' : 'afterglow', FADE_MS, elapsed);
      badge.title = threads.size > 0 ? [...threads].join('\n') : '';
      badges.append(badge);
    }
    return badges;
  }

  function slot(label, cell) {
    const s = el('div', 'slot');
    s.append(el('div', 'label', label), cell);
    return s;
  }

  function taskCell(taskId, className, subText) {
    const cell = el('div', className);
    cell.append(el('div', 'cid', `#${taskId}`), el('div', 'dur', subText ?? seconds(tasks.get(taskId)?.durationMs)));
    return cell;
  }

  function renderGhosts(queue, side) {
    const now = performance.now();
    return queue.ghosts
      .filter(g => g.side === side && now - g.start < CELL_FADE_MS)
      .map(g => {
        const ghost = slot('', taskCell(g.taskId, `cell ${g.kind}`, g.text));
        ghost.style.animation = continued('fade-out', CELL_FADE_MS, now - g.start);
        return ghost;
      });
  }

  // take забирает с головы (слева), offer кладёт в хвост (справа)
  function renderLine(queue) {
    const line = el('div', 'line');
    const n = queue.taskIds.length;
    const capacity = queue.capacity;
    const drawEmpty = capacity !== null && capacity <= MAX_DRAWN_CELLS;
    const count = drawEmpty ? Math.max(capacity, n) : n;
    const added = queue.added;
    const addedElapsed = added ? performance.now() - added.start : Infinity;

    line.append(...renderGhosts(queue, 'head'), el('span', 'dir', 'take ◀'));
    for (let i = 0; i < count; i++) {
      if (i >= n) { line.append(slot('', el('div', 'cell'))); continue; }
      const label = i === 0 && i === n - 1 ? 'head·tail' : i === 0 ? 'head' : i === n - 1 ? 'tail' : '';
      const cell = taskCell(queue.taskIds[i], 'cell filled');
      if (added?.index === i && addedElapsed < CELL_FADE_MS) cell.style.animation = continued('cell-new', CELL_FADE_MS, addedElapsed);
      line.append(slot(label, cell));
    }
    if (count === 0) line.append(el('span', 'empty', 'пусто'));
    line.append(el('span', 'dir', '◀ offer'), ...renderGhosts(queue, 'tail'));

    const capacityText = capacity === null ? '?' : capacity === INT_MAX ? '∞' : capacity;
    line.append(el('span', 'size', `${n} / ${capacityText}`));
    return line;
  }

  function renderWaiting(queue) {
    const row = el('div', 'waiting');
    row.append(el('span', 'empty', 'ждут в take:'));
    if (queue.waiting.size === 0) row.append(el('span', 'empty', '—'));
    const now = performance.now();
    for (const [thread, w] of queue.waiting) {
      const chip = el('span', 'thread-chip' + (w.failed ? ' failed' : ''), thread);
      chip.style.setProperty('--thread', threadColor(thread));
      if (w.failed) {
        chip.title = `✗ ${w.error}`;
        chip.style.animation = continued('fade-out', FAILED_FADE_MS, now - w.endedAt);
      } else {
        chip.title = `${thread} внутри take(): ждёт, пока в очереди появится задача`;
      }
      row.append(chip);
    }
    return row;
  }

  // ---------- Синхронизация карточек с состоянием ----------

  function render() {
    renderTasks();
    const root = $('queues');

    // Удалить карточки исчезнувших очередей
    for (const [id, { card }] of cards) {
      if (!queues.has(id)) { card.remove(); cards.delete(id); }
    }

    // Создать карточки новых очередей — по порядку id
    for (const queue of [...queues.values()].sort((a, b) => a.id - b.id)) {
      if (!cards.has(queue.id)) {
        const created = createCard(queue.id);
        cards.set(queue.id, created);
        const next = [...root.querySelectorAll('.queue-card')].find(c => Number(c.dataset.id) > queue.id);
        root.insertBefore(created.card, next ?? null);
      }
      // Пульт не трогаем — перерисовываем только правую часть
      cards.get(queue.id).state.replaceChildren(renderBadges(queue), renderLine(queue), renderWaiting(queue));
    }

    const placeholder = root.querySelector('.empty-queues');
    if (queues.size === 0 && !placeholder) {
      root.innerHTML = '<div class="empty empty-queues">нет очередей — нажмите «+ new queue»</div>';
    } else if (queues.size > 0 && placeholder) {
      placeholder.remove();
    }
  }

  // ---------- WebSocket ----------

  function showEnvelope(env) {
    const type = env.data?.objectType;
    if (type !== QUEUE && type !== TASK) return; // чужие события (списки и т.п.) не засоряют лог
    const row = document.createElement('div');
    const typeEl = el('span', 'type', env.type);
    const time = new Date(env.ts).toISOString().slice(11, 23); // HH:MM:SS.mmm, UTC
    row.append(`#${env.seq}  ${time}  `, typeEl, `  ${JSON.stringify(env.data)}`);
    if (env.type.endsWith('_FAILED')) row.className = 'error';
    $('ws').prepend(row);
  }

  function onMessage(raw) {
    let env;
    try {
      env = JSON.parse(raw);
    } catch (e) {
      prepend('ws', `не JSON: ${raw}`, true);
      return;
    }
    showEnvelope(env);
    apply(env);
    render();
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws/events`);
    ws.onopen = () => {
      $('status').textContent = '● ws connected';
      $('status').className = 'on';
    };
    ws.onclose = () => {
      $('status').textContent = '● ws disconnected';
      $('status').className = 'off';
      setTimeout(connect, 1000);
    };
    ws.onmessage = msg => onMessage(msg.data);
  }

  render();
  connect();
</script>
</body>
