<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LinkedBlockingQueue&lt;Runnable&gt; playground</title>
  <!-- Сначала общий каркас и компоненты: стили страницы ниже могут их уточнять -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="blockingqueue.css">
  <style>
    /* --- карточка очереди: .list-card из base.css; ёмкость в заголовке --- */
    .card-title .capacity { color: var(--dim); }
  </style>
</head>
<body>

<header>
  <h2>LinkedBlockingQueue&lt;Runnable&gt; playground</h2>
  <span id="status" class="off">● ws disconnected</span>
</header>

<div>
  capacity <input id="capacity" type="number" value="3" min="1">
  <button id="create" class="primary" title="POST /api/linkedblockingqueuerunnable — создать очередь; карточка появится по событию OBJECT_CREATED">+ new queue</button>
</div>

<!-- Карточка на каждую очередь: слева управляем ей, справа смотрим результат -->
<div id="lists"></div>

<h3>HTTP <button class="link" id="clearHttp">clear</button></h3>
<div id="http" class="log"></div>

<h3>WebSocket <button class="link" id="clearWs">clear</button></h3>
<div id="ws" class="log"></div>

<script src="base.js"></script>
<script src="components.js"></script>
<script src="blockingqueue.js"></script>
<script>
  // Модель, отрисовка состояния и REST — в blockingqueue.js; здесь только форма создания и карточки
  const { $ } = UI;
  const View = BlockingQueueView;
  const INT_MAX = 2147483647; // ёмкость LinkedBlockingQueue() без аргумента

  // Карточку создаёт не ответ на create, а событие OBJECT_CREATED — так же, как для очередей, созданных извне
  $('create').onclick = () => View.create({ capacity: Number($('capacity').value) });

  const store = View.createStore(render);

  const capacityText = capacity => capacity === null ? '?' : capacity === INT_MAX ? '∞' : capacity;

  // Карточка создаётся один раз: пульт не пересоздаётся, поэтому введённые значения и фокус не теряются
  function createCard(queue) {
    const card = KV.el('div', 'list-card');
    const controls = KV.el('div', 'card-controls');
    const title = KV.el('div', 'card-title', `queue #${queue.id} `);
    // Ёмкость здесь, а не в состоянии: без неё непонятно, почему offer вернул false
    title.append(KV.el('span', 'capacity', `· capacity ${capacityText(queue.capacity)}`));
    const remove = KV.el('button', 'danger', 'remove queue');
    remove.onclick = () => View.remove(store, queue.id);
    controls.append(title, KV.renderOps(View.operations, queue.id), remove);
    const state = KV.el('div', 'card-state');
    card.append(controls, state);
    return { card, state };
  }

  // Карточка на каждый объект, по порядку id: пульт создаётся один раз, состояние справа перерисовывается
  const cards = UI.cardList('lists', {
    create: createCard,
    update: (queue, { state }) => state.replaceChildren(...View.renderState(store, queue)),
    empty: 'no queues — press «+ new queue»',
  });

  function render() {
    cards.sync(store.items);
  }

  // Подключение, лог событий и переподключение — UI.connect из base.js
  render();
  UI.connect({ onEnvelope: env => { store.apply(env); render(); }, types: View.types });
</script>
</body>
</html>
