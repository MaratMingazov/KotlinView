<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Semaphore playground</title>
  <!-- Сначала общий каркас и компоненты: стили страницы ниже могут их уточнять -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="semaphore.css">
  <style>
    .create { display: flex; gap: 12px; align-items: center; }
    .create label { display: flex; gap: 6px; align-items: center; color: var(--fn); }
  </style>
</head>
<body>

<header>
  <h2>Semaphore playground</h2>
  <span id="status" class="off">● ws disconnected</span>
</header>

<!-- Здесь, в отличие от плиток index.html, можно задать fair и отрицательные permits (семафор «в долг») -->
<div class="create">
  <label>permits <input id="permits" type="number" value="2" aria-label="permits"></label>
  <label>fair <input id="fair" type="checkbox" aria-label="fair"></label>
  <button id="create" class="primary" title="POST /api/semaphore {permits, fair} — the card appears on OBJECT_CREATED">+ new semaphore</button>
</div>

<!-- Карточка на каждый семафор: слева управляем им, справа смотрим результат -->
<div id="lists"></div>

<h3>HTTP <button class="link" id="clearHttp">clear</button></h3>
<div id="http" class="log"></div>

<h3>WebSocket <button class="link" id="clearWs">clear</button></h3>
<div id="ws" class="log"></div>

<script src="base.js"></script>
<script src="components.js"></script>
<script src="semaphore.js"></script>
<script>
  // Модель, отрисовка состояния и REST — в semaphore.js; здесь только форма создания и карточки
  const { $ } = UI;
  const View = SemaphoreView;

  // Карточку создаёт не ответ на create, а событие OBJECT_CREATED — так же, как для семафоров, созданных извне
  $('create').onclick = () => View.create(Number($('permits').value), $('fair').checked);
  $('permits').addEventListener('keydown', e => { if (e.key === 'Enter') $('create').click(); });

  const store = View.createStore(render);

  // Карточка создаётся один раз: пульт не пересоздаётся
  function createCard(sem) {
    const card = KV.el('div', 'list-card');
    const controls = KV.el('div', 'card-controls');
    const remove = KV.el('button', 'danger', 'remove semaphore');
    remove.title = 'DELETE — refused (409) while someone waits';
    remove.onclick = () => View.remove(store, sem.id);
    controls.append(KV.el('div', 'card-title', `semaphore #${sem.id}`), KV.renderOps(View.operations, sem.id), remove);
    const state = KV.el('div', 'card-state');
    card.append(controls, state);
    return { card, state };
  }

  // Карточка на каждый объект, по порядку id: пульт создаётся один раз, состояние справа перерисовывается
  const cards = UI.cardList('lists', {
    create: createCard,
    update: (sem, { state }) => state.replaceChildren(...View.renderState(store, sem)),
    empty: 'no semaphores — press «+ new semaphore»',
  });

  function render() {
    cards.sync(store.items);
  }

  // Подключение, лог событий и переподключение — UI.connect из base.js
  render();
  UI.connect({ onEnvelope: env => { store.apply(env); render(); }, types: View.types });
</script>
</body>
</html>
