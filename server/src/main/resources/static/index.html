<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KotlinView</title>
  <link rel="stylesheet" href="core/base.css">
  <link rel="stylesheet" href="core/components.css">
  <link rel="stylesheet" href="structures/pool.css">
  <link rel="stylesheet" href="structures/synchronousqueue.css">
  <link rel="stylesheet" href="structures/semaphore.css">
  <link rel="stylesheet" href="core/tiles.css">
  <style>
    /*
     * Тёмное оформление «Night Harbour»: ночная гавань вокруг островов, тёплые акценты-фонари. Переопределены
     * переменные base.css — плитки, бейджи и конверты перекрашиваются сами, их стили не трогаем. Диорама — своя палитра
     */
    :root {
      --bg: #14202b; --panel: #1c2b38; --border: #2a3c4b; --text: #d6e2ea; --dim: #7f95a6;
      --keyword: #f0b37e; --fn: #7cc4e4; --num: #8fd3c1; --str: #8fcf7a;
      --in: #7cc4e4; --out: #8fcf7a; --fail: #f08a7e;
      --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .35);
      --grid: #1d2c39; /* линии сетки фона — на тон светлее --bg */
    }
    /*
     * Фон страницы — тонкая сетка 32 px (линии на тон светлее фона); карточки, плитка и рамка диорамы — сплошные поверх.
     * Шапка — во всю ширину, поэтому отступы у колонки (.page), а не у body
     */
    body {
      margin: 0; min-height: 100vh;
      background-color: var(--bg);
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px; background-position: -1px -1px;
    }
    .page { max-width: 1400px; margin: 0 auto; padding: 4px 24px 16px; }

    /* Шапка: невысокая, прилипает к верху, полупрозрачная с размытием; слева — знак, название и разделы, справа — статус */
    .topbar {
      position: sticky; top: 0; z-index: 10; height: 48px; box-sizing: border-box; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-left { display: flex; align-items: center; gap: 28px; }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: bold; text-decoration: none; }
    .brand svg { width: 20px; height: 20px; }
    .topnav { display: flex; gap: 20px; }
    .topnav a { color: var(--dim); text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
    .topnav a:hover { color: var(--text); }
    .topnav a.current { color: var(--text); border-bottom-color: var(--keyword); }
    .topnav a.disabled { opacity: .45; cursor: default; pointer-events: none; }
    #status { font-size: 12px; }
    button, input, select { border-radius: 6px; }

    /* Выбор структуры: лента карточек — миниатюра диорамы и название */
    .carousel { display: flex; gap: 14px; overflow-x: auto; padding: 14px 4px 16px; scrollbar-width: none; }
    .card {
      flex: none; width: 220px; padding: 6px 6px 4px; text-align: center; text-decoration: none; color: var(--text);
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
      transition: transform .2s;
    }
    .card:hover { transform: translateY(-3px); }
    .card.on { outline: 3px solid var(--keyword); transform: translateY(-3px); }
    /* Одна высота у всех миниатюр (у сцен разные пропорции): вода — фон рамки, остров — по центру */
    .card svg, .card .blank { display: block; width: 100%; height: 130px; border-radius: 6px; pointer-events: none; background: #79c4df; }
    /* Парящая плита (backdrop: 'none') — без воды: на фоне страницы */
    .card svg.floating { background: var(--bg); }
    .card .name { padding: 4px 0 2px; font-weight: bold; }

    /*
     * Выбранная структура — одной колонкой по центру: сверху полоса структуры (пульт слева, точное состояние
     * правее), ниже диорама той же ширины
     */
    .stage { display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin: 0 auto; }
    .stage > * { box-sizing: border-box; } /* полоса и диорама — одной ширины */
    .diorama-panel, .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
    .diorama-panel { padding: 8px; }
    .diorama { display: block; }
    .diorama text { font-family: inherit; }
    .diorama .hoverable { cursor: pointer; }
    /* Шапка диорамы (название и счётчики в углу) — пока скрыта: название есть в карточке и в плитке над диорамой */
    .diorama .hud { display: none; }

    /* Полоса структуры: живая — шапка (название, статус, ✕), под ней «пульт | состояние» */
    .tile { min-height: 0; padding: 12px 16px; }
    .tile.live { border-color: var(--border); }
    .tile-title { font-weight: bold; }
    .tile button, .tile input, .tile select { background: var(--bg); }
    .tile-main { grid-template-columns: max-content minmax(0, 1fr); gap: 20px; min-height: 96px; } /* не прыгать по высоте */
    .tile-controls { padding-right: 20px; }
    /* Состояние — в ряд, с переносом, если не влезает: очередь, воркеры, ждущие… */
    .tile-body { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-start; }
    /* Первая строка — бейджи методов (у пула: execute / shutdown / shutdownNow / terminated), под ними — очередь,
       правее неё — воркеры */
    .tile-body > .badges { flex-basis: 100%; }
    .tile-body .notice, .tile-body .semtask-notice { flex-basis: 100%; min-height: 0; margin-top: 0; }
    .tile-body .notice:empty { display: none; }
    /* Спящая — в одну строку: название, параметры, start */
    .tile.sleeping { flex-direction: row; justify-content: flex-start; gap: 28px; }
    .tile.sleeping .tile-params { flex-direction: row; gap: 18px; }

    details.logs { margin-top: 24px; }
    details.logs summary { color: var(--dim); cursor: pointer; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a class="brand" href="index.html">
      <!-- Знак: изометрический ящик в цветах страницы -->
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <polygon points="10,2 18,6 10,10 2,6" fill="#f0b37e"/>
        <polygon points="2,6 10,10 10,18 2,14" fill="#c98f5d"/>
        <polygon points="18,6 10,10 10,18 18,14" fill="#a8744a"/>
      </svg>
      KotlinView
    </a>
    <nav class="topnav">
      <a class="current" href="index.html">Dioramas</a>
      <a class="disabled" title="soon">Docs</a>
    </nav>
  </div>
  <span id="status" class="off">● ws disconnected</span>
</header>

<div class="page">
<nav id="carousel" class="carousel"></nav>
<main id="stage" class="stage"></main>

<!-- Логи нужны UI.call / UI.connect; свёрнуты — открыть при отладке -->
<details class="logs">
  <summary>logs</summary>
  <h3>HTTP <button class="link" id="clearHttp">clear</button></h3>
  <div id="http" class="log"></div>
  <h3>WebSocket <button class="link" id="clearWs">clear</button></h3>
  <div id="ws" class="log"></div>
</details>
</div>

<script src="core/base.js"></script>
<script src="core/components.js"></script>
<script src="structures/synchronousqueue.js"></script>
<script src="structures/pool.js"></script>
<script src="structures/blockingqueue.js"></script>
<script src="structures/semaphore.js"></script>
<script src="structures/semaphoretask.js"></script>
<script src="core/tiles.js"></script>
<!-- Диорамы: движок → реквизит → набор → каркас → описания структур -->
<script src="diorama/engine/iso-scene.js"></script>
<script src="diorama/props/iso-vehicles.js"></script>
<script src="diorama/props/iso-ground.js"></script>
<script src="diorama/props/iso-buildings.js"></script>
<script src="diorama/props/iso-nature.js"></script>
<script src="diorama/props/iso-people.js"></script>
<script src="diorama/props/iso-port.js"></script>
<script src="diorama/kit/diorama-kit.js"></script>
<script src="diorama/kit/diorama-street.js"></script>
<script src="diorama/scenes/diorama-pool.js"></script>
<script src="diorama/scenes/diorama-semaphore.js"></script>
<script src="diorama/scenes/diorama-queue.js"></script>
<script src="diorama/scenes/diorama-sync.js"></script>
<script src="diorama/scenes/diorama-cached.js"></script>
<script>
  /*
   * Структуры: плитка (пульт и точный вид) и её диорама. Плитки — с пределами:
   * столько, сколько помещается на острове (LIMITS описания). id — адрес (#pool), diorama — описание для набора
   */
  const STRUCTURES = [
    { id: 'pool', diorama: PoolDiorama,
      view: { ...Pool.fixed, params: [['nThreads', 2, { min: 1, max: PoolDiorama.LIMITS.bays }]] } },
    // Поля ввода нет: пул — не больше стольких потоков, сколько кранов в порту (на сервере по умолчанию 5)
    { id: 'cached', diorama: CachedDiorama, view: Pool.cachedOf(CachedDiorama.LIMITS.cranes) },
    { id: 'sem', diorama: SemaphoreDiorama,
      // durationMs, fair, timeoutMs не вводятся: по умолчанию (5000 и false — сервер, 2000 — create в semaphoretask.js)
      view: { ...SemaphoreTaskView, params: [['permits', 2, { min: 1, max: SemaphoreDiorama.LIMITS.inside }],
        ['mode', 'ACQUIRE', { options: [['ACQUIRE', 'blocking'], ['TRY_ACQUIRE', 'non-blocking'], ['TRY_ACQUIRE_TIMEOUT', 'timeout 2s']] }]] } },
    { id: 'lbq', diorama: QueueDiorama,
      view: { ...BlockingQueueView, params: [['capacity', 3, { min: 1, max: QueueDiorama.LIMITS.slots }]] } },
    { id: 'sync', diorama: SyncDiorama, view: SynchronousQueueView },  ];

  const stage = document.getElementById('stage');
  let selected = null, panel = null; // выбранная структура и её живая диорама (остальные не рисуются)

  // Карточки: миниатюра — демо-снимок диорамы без шапки и табличек; диорамы ещё нет — пустая вода той же высоты
  const carousel = document.getElementById('carousel');
  const cards = new Map();
  for (const item of STRUCTURES) {
    const card = KV.el('a', 'card');
    card.href = `#${item.id}`;
    card.append(item.diorama ? miniature(item.diorama) : KV.el('div', 'blank'), KV.el('div', 'name', item.view.title));
    carousel.append(card);
    cards.set(item.id, card);
  }

  function miniature({ kind, demo, demoShape }) {
    const svg = Kit.show({ ...kind, uid: `${kind.uid}-card` }, demo, demoShape);
    svg.querySelectorAll(':scope > g[style*="pointer-events: none"], .labels').forEach(n => n.remove());
    return svg;
  }

  // Плитки: все живут (их store принимает события), на странице — только плитка выбранной структуры (полоса над диорамой)
  const { tiles, render } = Tiles.mount(STRUCTURES.map(s => s.view), {
    place: tile => { STRUCTURES.find(s => s.view === tile.view).tile = tile; },
    onRender: () => { if (selected) panel?.update(selected.tile); },
  });
  // Пока плитка спит, диорама показывает «пустой» остров по полю параметров — обновлять при вводе
  for (const tile of tiles) for (const input of Object.values(tile.inputs)) input.addEventListener('input', render);

  // Выбор по адресу (#pool, #cached, #sem, #lbq, #sync): новая живая диорама — сразу с машинами на местах; нет диорамы — только полоса
  function select() {
    selected = STRUCTURES.find(s => `#${s.id}` === location.hash) ?? STRUCTURES[0];
    for (const [id, card] of cards) card.classList.toggle('on', id === selected.id);
    panel = selected.diorama ? Kit.panel(selected.diorama.kind) : null;
    stage.replaceChildren(selected.tile.el, ...(panel ? [panel.el] : [])); // полоса структуры — сверху, диорама — под ней
    panel?.update(selected.tile);
  }
  window.addEventListener('hashchange', select);
  select();
</script>
</body>
</html>
