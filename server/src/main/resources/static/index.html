<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>KotlinView — ThreadPoolExecutor</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #f6f7f9; color: #222; }
    button { padding: 6px 14px; cursor: pointer; }
    #status { font-size: 13px; }
    #status.on { color: #2e7d32; }
    #status.off { color: #c62828; }

    .row { display: flex; align-items: flex-start; gap: 16px; margin-top: 24px; }
    .controls { display: flex; flex-direction: column; gap: 8px; width: 110px; }

    .pool {
      width: 860px; min-height: 260px; padding: 12px; box-sizing: border-box;
      border: 2px dashed #bbb; border-radius: 10px; background: #fff;
      display: flex; flex-direction: column; gap: 12px;
    }
    .pool.bound { border-style: solid; border-color: #2e7d32; }

    .header { display: flex; align-items: center; gap: 8px; font-family: monospace; font-size: 16px; font-weight: bold; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #ccc; }
    .dot.RUNNING { background: #2e7d32; }
    .dot.SHUTDOWN { background: #ef6c00; }
    .dot.TERMINATED { background: #616161; }
    .state { font-size: 12px; font-weight: normal; color: #777; }

    .config { font-family: monospace; font-size: 13px; color: #555;
              display: grid; grid-template-columns: max-content max-content; gap: 2px 16px; }

    .methods { display: flex; gap: 8px; }
    .method {
      width: 160px; min-height: 56px; padding: 8px; box-sizing: border-box;
      border: 2px solid #ccc; border-radius: 8px; background: #fafafa; color: #999;
      transition: background .15s, border-color .15s;
    }
    .method .name { font-family: monospace; font-size: 14px; font-weight: bold; }
    .method .threads { margin-top: 4px; font-family: monospace; font-size: 12px; }
    .method.active { background: #c8f7c5; border-color: #2e7d32; color: #222; }  /* поток внутри метода */
    .method.done { border-color: #999; color: #555; }                              /* поток уже вышел */

    .section { border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
    .section .title { font-size: 12px; color: #777; margin-bottom: 6px; }
    .placeholder { font-size: 12px; color: #aaa; font-style: italic; }

    .queue-row { display: flex; align-items: flex-start; gap: 8px; }
    .cells { display: flex; gap: 4px; padding: 6px; border: 2px dashed #bbb; border-radius: 8px; }
    .cell { width: 32px; height: 32px; border: 2px solid #999; border-radius: 6px; background: #fff; }
    .cell.filled { background: #90caf9; border-color: #1565c0; }
    .queue-size { font-family: monospace; font-size: 12px; color: #555; margin-top: 4px; text-align: center; }

    .workers { display: flex; flex-wrap: wrap; gap: 8px; }
    .worker {
      width: 200px; padding: 8px; box-sizing: border-box; font-family: monospace; font-size: 12px;
      border: 2px solid #ccc; border-radius: 8px; background: #fafafa; color: #555;
      transition: background .15s, border-color .15s;
    }
    .worker .wname { font-size: 13px; font-weight: bold; color: #222; word-break: break-all; }
    .worker .wstate { margin-top: 4px; font-weight: bold; }
    .worker .wmeta { margin-top: 4px; color: #777; }
    .worker.CREATED { border-style: dashed; color: #999; }                  /* поток создан, но ещё не запущен */
    .worker.IDLE { border-color: #1565c0; background: #e3f2fd; }            /* живой, задачи нет */
    .worker.BUSY { border-color: #2e7d32; background: #c8f7c5; }            /* выполняет задачу */
    .worker.TERMINATED { border-color: #bbb; background: #eee; opacity: .6; }
    .worker.TERMINATED .wname { text-decoration: line-through; }
    .worker.error { border-color: #c62828; background: #ffcdd2; opacity: 1; }

    #log { margin-top: 32px; height: 200px; overflow: auto; background: #fff; border: 1px solid #ddd;
           font-family: monospace; font-size: 12px; padding: 8px; white-space: pre; }
  </style>
</head>
<body>

<span id="status" class="off">● disconnected</span>

<div class="row">
  <div class="controls">
    <button id="create">create</button>
    <button id="execute">execute</button>
    <button id="shutdown">shutdown</button>
  </div>

  <div id="pool" class="pool">
    <div class="header">
      <span id="dot" class="dot"></span><span id="poolId">нет пула</span><span id="state" class="state"></span>
    </div>
    <div id="config" class="config"></div>
    <div class="methods">
      <div id="shutdownMethod" class="method">
        <div class="name">shutdown()</div>
        <div class="threads"></div>
      </div>
    </div>
    <div class="section">
      <div class="title">queue <span id="queueId"></span></div>
      <div class="queue-row">
        <div id="offerMethod" class="method">
          <div class="name">offer()</div>
          <div class="threads"></div>
        </div>
        <div>
          <div id="cells" class="cells"></div>
          <div id="queueSize" class="queue-size"></div>
        </div>
        <div id="takeMethod" class="method">
          <div class="name">take()</div>
          <div class="threads"></div>
        </div>
        <div id="pollMethod" class="method">
          <div class="name">poll()</div>
          <div class="threads"></div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="title">threads <span id="workersCount"></span></div>
      <div id="workers" class="workers"></div>
    </div>
  </div>
</div>

<div id="log"></div>

<script>
  const state = {
    poolId: null,       // какой пул визуализирует прямоугольник (из CreateThreadPoolResponse)
    pending: false,     // нажали create, ждём ответ
    pools: {},          // poolId -> { config, state, methods }
    queues: {},         // все очереди: queueId -> { size, methods }. Пул ссылается на свою через config.queueId
    workers: {},        // все потоки фабрик: threadName -> { threadFactoryId, name, parent, state, taskId, completed, error }
  };

  const $ = id => document.getElementById(id);

  const newMethod = () => ({ threads: new Set(), done: false });

  function poolOf(poolId) {
    return state.pools[poolId] ??= {
      config: null,     // CreateThreadPoolResponse
      state: null,      // RUNNING → SHUTDOWN → TERMINATED
      methods: { shutdown: newMethod() },
    };
  }

  function queueOf(queueId) {
    return state.queues[queueId] ??= {
      size: 0,
      methods: { offer: newMethod(), take: newMethod(), poll: newMethod() },
    };
  }

  // поток вошёл в метод / вышел из него
  const enter = (method, thread) => method.threads.add(thread);
  const exit = (method, thread) => { method.threads.delete(thread); method.done = true; };

  function renderMethod(el, method) {
    const threads = method ? [...method.threads] : [];
    el.classList.toggle('active', threads.length > 0);
    el.classList.toggle('done', !!method?.done && threads.length === 0);
    el.querySelector('.threads').innerHTML =
      threads.length > 0 ? threads.join('<br>') : (method?.done ? 'вышел ✓' : '');
  }

  // ---------- Рендер ----------

  function render() {
    const pool = state.poolId && state.pools[state.poolId];
    const config = pool?.config;
    $('create').disabled = state.pending || state.poolId !== null;
    // execute после shutdown не блокируем: пусть будет видно, как пул отклоняет задачу
    $('execute').disabled = !pool?.state;
    $('shutdown').disabled = pool?.state !== 'RUNNING';
    $('pool').classList.toggle('bound', !!config);
    $('dot').className = 'dot ' + (pool?.state ?? '');
    $('poolId').textContent = state.poolId ?? (state.pending ? 'создаётся…' : 'нет пула');
    $('state').textContent = pool?.state ?? '';

    $('config').innerHTML = !config ? '' : [
      ['corePoolSize', config.corePoolSize],
      ['maximumPoolSize', config.maximumPoolSize],
      ['keepAliveMs', config.keepAliveMs],
      ['queueType', config.queueType],
      ['queueCapacity', config.queueCapacity ?? '∞'],
      ['threadFactory', config.threadFactoryId],
    ].map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('');

    renderMethod($('shutdownMethod'), pool?.methods.shutdown);
    renderQueue(config);
    renderWorkers(config);
  }

  function renderWorkers(config) {
    const queue = config?.queueId ? state.queues[config.queueId] : null;
    // порядок вставки в объект = порядок ThreadCreated, то есть порядок создания воркеров
    const workers = !config ? [] :
      Object.values(state.workers).filter(w => w.threadFactoryId === config.threadFactoryId);
    const alive = workers.filter(w => w.state !== 'TERMINATED').length;
    $('workersCount').textContent = !config ? '' :
      `живых: ${alive} / core: ${config.corePoolSize} / max: ${config.maximumPoolSize}`;

    $('workers').innerHTML = workers.map(w => {
      // IDLE уточняем по очереди: воркер без задачи обычно сидит в take() или poll()
      let label = w.state;
      if (w.state === 'BUSY') label = `BUSY · task-${w.taskId}`;
      else if (w.state === 'IDLE' && queue?.methods.take.threads.has(w.name)) label = 'IDLE · ждёт в take()';
      else if (w.state === 'IDLE' && queue?.methods.poll.threads.has(w.name)) label = 'IDLE · ждёт в poll()';
      return `
        <div class="worker ${w.state} ${w.error ? 'error' : ''}">
          <div class="wname">${w.name}</div>
          <div class="wstate">${label}</div>
          <div class="wmeta">created by ${w.parent}</div>
          <div class="wmeta">completed: ${w.completed}</div>
          ${w.error ? `<div class="wmeta">error: ${w.error}</div>` : ''}
        </div>`;
    }).join('');
  }

  function renderQueue(config) {
    const queue = config?.queueId ? state.queues[config.queueId] : null;
    $('queueId').textContent = config?.queueId ?? '';
    renderMethod($('offerMethod'), queue?.methods.offer);
    renderMethod($('takeMethod'), queue?.methods.take);
    renderMethod($('pollMethod'), queue?.methods.poll);

    const size = queue?.size ?? 0;
    const capacity = config?.queueCapacity;
    const cells = $('cells');
    cells.innerHTML = '';
    // для безграничной очереди (capacity = null) ячейки не рисуем, только число
    if (capacity) {
      // tail слева (рядом с offer), head справа (рядом с take) — заполняем справа налево
      for (let i = 0; i < capacity; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell' + (i >= capacity - size ? ' filled' : '');
        cells.appendChild(cell);
      }
    }
    cells.style.display = cells.childElementCount ? '' : 'none';
    $('queueSize').textContent = !config ? '' : `${size} / ${capacity ?? '∞'}`;
  }

  function log(text) {
    const el = $('log');
    el.textContent += text + '\n';
    el.scrollTop = el.scrollHeight;
  }

  // ---------- События ----------

  const handlers = {
    PoolShutdownIn(e) {
      enter(poolOf(e.poolId).methods.shutdown, e.thread);
    },
    PoolShutdownOut(e) {
      const pool = poolOf(e.poolId);
      exit(pool.methods.shutdown, e.thread);
      // если воркеров нет, PoolTerminated приходит раньше (изнутри super.shutdown) — не откатываем состояние назад
      if (pool.state === 'RUNNING') pool.state = 'SHUTDOWN';
    },
    PoolTerminated(e) {
      poolOf(e.poolId).state = 'TERMINATED';
    },

    // Очередь: Before* — поток вошёл в метод, After* — вышел. queueSize обновляем по обоим.
    BeforeOffer: e => queueEnter('offer', e),
    AfterOffer: e => queueExit('offer', e),
    BeforeTake: e => queueEnter('take', e),
    AfterTake: e => queueExit('take', e),
    BeforePoll: e => queueEnter('poll', e),
    AfterPoll: e => queueExit('poll', e),

    // Воркеры: CREATED → IDLE ⇄ BUSY → TERMINATED
    ThreadCreated(e) {
      state.workers[e.threadName] = {
        threadFactoryId: e.threadFactoryId, name: e.threadName, parent: e.parentThreadName,
        state: 'CREATED', taskId: null, completed: 0, error: null,
      };
    },
    ThreadStarted(e) {
      workerOf(e.threadName).state = 'IDLE';
    },
    TaskStarted(e) {
      const w = workerOf(e.thread);
      w.state = 'BUSY';
      w.taskId = e.taskId;
    },
    TaskCompleted(e) {
      const w = workerOf(e.thread);
      w.state = 'IDLE';
      w.taskId = null;
      w.completed++;
    },
    TaskFailed(e) {
      const w = workerOf(e.thread);
      w.state = 'IDLE';
      w.taskId = null;
    },
    ThreadTerminated(e) {
      const w = workerOf(e.threadName);
      w.state = 'TERMINATED';
      w.taskId = null;
      w.error = e.error;
    },
  };

  // ThreadCreated мог прийти до открытия страницы: не падаем. Такой воркер не рисуется — фабрика неизвестна
  function workerOf(name) {
    return state.workers[name] ??= {
      threadFactoryId: null, name, parent: '?', state: 'IDLE', taskId: null, completed: 0, error: null,
    };
  }

  function queueEnter(method, e) {
    const queue = queueOf(e.queueId);
    queue.size = e.queueSize;
    enter(queue.methods[method], e.thread);
  }

  function queueExit(method, e) {
    const queue = queueOf(e.queueId);
    queue.size = e.queueSize;
    exit(queue.methods[method], e.thread);
  }

  function onEnvelope(env) {
    log(`#${env.seq} ${env.type} ${JSON.stringify(env.data)}`);
    const handler = handlers[env.type];
    if (!handler) return;
    handler(env.data);
    render();
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws/events`);
    ws.onopen = () => {
      $('status').textContent = '● web-socket connected';
      $('status').className = 'on'; }; //  'on' зеленый цвет //
    ws.onclose = () => {
      $('status').textContent = '● websocket disconnected';
      $('status').className = 'off';
      setTimeout(connect, 1000);
    };
    // обрабатываем каждый web socket message
    ws.onmessage = msg => onEnvelope(JSON.parse(msg.data));
  }

  // ---------- Кнопки ----------

  $('create').onclick = async () => {
    const CREATE_REQUEST = { corePoolSize: 1, maximumPoolSize: 1, keepAliveMs: 2000, queueType: 'LINKED', queueCapacity: 2 };
    state.pending = true;
    render();
    const res = await fetch('/api/executors', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(CREATE_REQUEST),
    });
    state.pending = false;
    if (!res.ok) {
      log(`create failed: ${res.status}`);
      render();
      return;
    }
    // событий о создании пула нет: всё про пул — в ответе
    const config = await res.json();
    log(`created ${JSON.stringify(config)}`);
    const pool = poolOf(config.poolId);
    pool.config = config;
    pool.state = 'RUNNING';
    state.poolId = config.poolId;
    render();
  };

  // Не ждём ответа: несколько быстрых нажатий — несколько параллельных потоков Tomcat в execute()
  $('execute').onclick = async () => {
    const res = await fetch(`/api/executors/${state.poolId}/execute`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ durationMs: 3000 }),
    });
    if (!res.ok) log(`execute failed: ${res.status}`);
  };

  // результат узнаём из событий PoolShutdownIn / PoolShutdownOut / PoolTerminated
  $('shutdown').onclick = async () => {
    const res = await fetch(`/api/executors/${state.poolId}/shutdown`, { method: 'POST' });
    if (!res.ok) log(`shutdown failed: ${res.status}`);
  };

  render();
  connect();
</script>
</body>
</html>
